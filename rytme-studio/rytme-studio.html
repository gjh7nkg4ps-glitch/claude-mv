<script data-modul="kommandoer">
/* ========== KOMMANDOER: alt, brugeren kan gøre ==========
   Hver kommando har et id, en titel (i18n-nøgle), måske en genvej, og en funktion.
   Knapper i HTML peger på en kommando med data-kommando="id". Run 5 bygger Ctrl+K oven på listen. */
'use strict';
RS.Kommandoer = (() => {
  const alle = new Map();
  function registrer(id, def) { alle.set(id, Object.assign({ id }, def)); }
  function kan(id) { const k = alle.get(id); return !!k && (!k.kan || k.kan()); }
  function koer(id, arg) {
    const k = alle.get(id);
    if (!k) { console.warn('[RS.Kommandoer] ukendt kommando: ' + id); return false; }
    if (k.kan && !k.kan()) return false;
    try {
      const r = k.koer(arg);
      if (r && typeof r.catch === 'function') r.catch(e => RS.Events.emit('fejl', e));
    } catch (e) { RS.Events.emit('fejl', e); }
    return true;
  }
  /* Tastetryk som tekst, fx "Space", "Shift+ArrowLeft", "M", "+". */
  function tastNavn(e) {
    let k = e.key;
    if (e.code === 'Space') k = 'Space';
    else if (k.length === 1) k = k.toUpperCase();
    const medShift = e.shiftKey && (k.length > 1 || /^[A-ZÆØÅ]$/.test(k));
    return (e.ctrlKey || e.metaKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (medShift ? 'Shift+' : '') + k;
  }
  function findGenvej(navn) { for (const k of alle.values()) if (k.genvej === navn) return k; return null; }
  return { registrer, kan, koer, tastNavn, findGenvej, hent: id => alle.get(id), liste: () => [...alle.values()] };
})();
/* ========== SLUT: KOMMANDOER ========== */
</script>

<script data-modul="audio">
/* ========== AUDIO: Web Audio-afspilleren ==========
   Filen afkodes til en AudioBuffer (hele sangen som tal i hukommelsen). Det giver præcis søgning og
   loop uden hak (AudioBufferSourceNode med loopStart og loopEnd).
   Signalvej:  kilde ─┬─► lydstyrke (GainNode) ─► højttaler
                      └─► måler (AnalyserNode), altså før lydstyrken
   Beskeder: 'audio:indlaest' {buffer, meta}, 'audio:tilstand' tilstand, 'audio:soegt' sekunder, 'status'. */
'use strict';
RS.Audio = (() => {
  const { Events, State, util } = RS;
  let ctx = null, volNode = null, maaler = null;
  let buffer = null, meta = null;
  let kilde = null, kildeId = 0, kildeLoop = null;   // kildeLoop: det loop, den kørende kilde bruger
  let tilstand = 'tom';                              // 'tom' | 'stoppet' | 'spiller' | 'pause'
  let startCtxTid = 0, startOffset = 0, pausePos = 0;
  let indlaesId = 0;

  function sikrCtx() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      Events.emit('status', { type: 'fejl', noegle: 'status.ingenWebAudio' });
      throw new Error('Web Audio mangler');
    }
    ctx = new AC({ latencyHint: 'interactive' });
    volNode = ctx.createGain();
    volNode.connect(ctx.destination);
    maaler = ctx.createAnalyser();
    maaler.fftSize = 2048;
    maaler.smoothingTimeConstant = 0;
    anvendLydstyrke(true);
    return ctx;
  }

  function saetTilstand(ny) {
    if (ny === tilstand) return;
    tilstand = ny;
    Events.emit('audio:tilstand', tilstand);
  }

  /* Skyderen går fra 0 til 1; forstærkningen er skyderen i anden (det passer bedre til øret). */
  function anvendLydstyrke(straks) {
    if (!ctx) return;
    const l = State.hent('lyd'), maal = l.mute ? 0 : l.volumen * l.volumen;
    if (straks) volNode.gain.value = maal;
    else volNode.gain.setTargetAtTime(maal, ctx.currentTime, 0.015);
  }
  State.lyt('lyd', () => anvendLydstyrke(false));

  /* Det stykke, der loopes lige nu: {a, b} i sekunder, eller null. */
  function loopOmraade() {
    if (!buffer) return null;
    const l = State.hent('sang.loop');
    if (l.tilstand === 'sang') return { a: 0, b: buffer.duration };
    if (l.tilstand === 'ab' && l.a != null && l.b != null && l.b - l.a >= 0.02) {
      return { a: util.klem(l.a, 0, buffer.duration), b: util.klem(l.b, 0, buffer.duration) };
    }
    return null;
  }

  function stopKilde() {
    if (!kilde) return;
    kildeId++;
    kilde.onended = null;
    try { kilde.stop(); } catch (e) { /* var ikke startet */ }
    kilde.disconnect();
    kilde = null;
  }
  function startKilde(fra) {
    stopKilde();
    const k = ctx.createBufferSource();
    k.buffer = buffer;
    const lo = loopOmraade();
    kildeLoop = lo && fra < lo.b - 0.001 ? lo : null;      // starter man efter B, spilles der til sangens slutning
    if (kildeLoop) { k.loop = true; k.loopStart = kildeLoop.a; k.loopEnd = kildeLoop.b; }
    k.connect(volNode);
    k.connect(maaler);
    const id = ++kildeId;
    k.onended = () => {
      if (id !== kildeId) return;                          // en ældre kilde; ikke den, der spiller nu
      kilde = null;
      pausePos = 0;
      saetTilstand('stoppet');
      Events.emit('audio:soegt', 0);
    };
    startCtxTid = ctx.currentTime;
    startOffset = fra;
    k.start(0, fra);
    kilde = k;
  }

  /* Hvor i sangen er vi (sekunder)? Læses i billed-løkken. */
  function position() {
    if (!buffer) return 0;
    if (tilstand !== 'spiller') return pausePos;
    let p = startOffset + (ctx.currentTime - startCtxTid);
    const lo = kildeLoop;
    if (lo && p >= lo.b) p = lo.a + ((p - lo.a) % (lo.b - lo.a));
    return p > buffer.duration ? buffer.duration : p;
  }

  async function afspil() {
    if (!buffer || tilstand === 'spiller') return;
    sikrCtx();
    if (ctx.state === 'suspended') await ctx.resume();
    let fra = pausePos;
    if (fra >= buffer.duration - 0.01) fra = 0;
    startKilde(fra);
    saetTilstand('spiller');
  }
  function pause() {
    if (tilstand !== 'spiller') return;
    pausePos = position();
    stopKilde();
    saetTilstand('pause');
  }
  function skift() { return tilstand === 'spiller' ? pause() : afspil(); }
  function stop() {
    if (!buffer) return;
    stopKilde();
    pausePos = 0;
    saetTilstand('stoppet');
    Events.emit('audio:soegt', 0);
  }
  function soeg(t) {
    if (!buffer) return;
    t = util.klem(t, 0, buffer.duration);
    if (tilstand === 'spiller') startKilde(Math.min(t, buffer.duration - 0.005));
    else pausePos = t;
    Events.emit('audio:soegt', t);
  }
  function flyt(dSek) { soeg(position() + dSek); }

  /* Loop'et er ændret, mens der spilles: start kilden igen samme sted med det nye loop. */
  State.lyt('sang.loop', () => {
    if (tilstand !== 'spiller') return;
    let p = position();
    const lo = loopOmraade();
    if (lo && p >= lo.b - 0.005) p = lo.a;                 // fx "Sæt B her": hop straks tilbage til A
    startKilde(p);
  });

  /* Sæt loop-punkt A eller B. Når begge findes, tændes A til B. */
  function saetLoopPunkt(hvilket, t) {
    if (!buffer) return;
    const l = Object.assign({}, State.hent('sang.loop'));
    l[hvilket] = util.klem(t, 0, buffer.duration);
    if (l.a != null && l.b != null) {
      if (l.a > l.b) { const x = l.a; l.a = l.b; l.b = x; }
      if (l.b - l.a < 0.05) { Events.emit('status', { type: 'info', noegle: 'status.loopForKort' }); return; }
      l.tilstand = 'ab';
    }
    State.saet('sang.loop', l);
  }
  function saetLoopOmraade(a, b) {
    if (!buffer) return;
    a = util.klem(a, 0, buffer.duration); b = util.klem(b, 0, buffer.duration);
    if (a > b) { const x = a; a = b; b = x; }
    if (b - a < 0.05) { Events.emit('status', { type: 'info', noegle: 'status.loopForKort' }); return; }
    State.saet('sang.loop', { tilstand: 'ab', a, b });
  }
  function rydLoopPunkter() {
    const l = State.hent('sang.loop');
    State.saet('sang.loop', { tilstand: l.tilstand === 'ab' ? 'fra' : l.tilstand, a: null, b: null });
  }
  /* Loop-knappen: Fra ↔ A til B (hvis punkterne findes), ellers Fra ↔ Hele sangen. */
  function skiftLoop() {
    const l = State.hent('sang.loop'), harAB = l.a != null && l.b != null;
    State.saet('sang.loop.tilstand', l.tilstand === 'fra' ? (harAB ? 'ab' : 'sang') : 'fra');
  }

  /* Tag en afkodet lyd i brug. */
  function brugBuffer(nyBuffer, nyMeta) {
    stopKilde();
    buffer = nyBuffer;
    meta = Object.assign({ kanaler: nyBuffer.numberOfChannels, rate: nyBuffer.sampleRate, varighed: nyBuffer.duration }, nyMeta);
    pausePos = 0;
    tilstand = 'stoppet';
    const noegle = meta.navn + '|' + Math.round(meta.varighed * 100);
    meta.husket = State.skiftSang(noegle, meta.forslag);
    Events.emit('audio:tilstand', tilstand);
    Events.emit('audio:indlaest', { buffer, meta });
  }

  /* Læs og afkod en lydfil. Kaster ikke: fejl vises som status, og den gamle sang bliver. */
  async function indlaesFil(fil) {
    const id = ++indlaesId;
    try { sikrCtx(); } catch (e) { return false; }
    Events.emit('status', { type: 'arbejder', noegle: 'status.laeser', vars: { navn: fil.name } });
    let bytes;
    try { bytes = await fil.arrayBuffer(); }
    catch (e) { if (id === indlaesId) Events.emit('status', { type: 'fejl', noegle: 'status.fejlLaes', vars: { navn: fil.name } }); return false; }
    if (id !== indlaesId) return false;                    // en nyere fil er på vej; den vinder
    Events.emit('status', { type: 'arbejder', noegle: 'status.afkoder', vars: { navn: fil.name } });
    let afkodet;
    try { afkodet = await ctx.decodeAudioData(bytes); }
    catch (e) { if (id === indlaesId) Events.emit('status', { type: 'fejl', noegle: 'status.fejlAfkod', vars: { navn: fil.name } }); return false; }
    if (id !== indlaesId) return false;
    brugBuffer(afkodet, { navn: fil.name, stoerrelse: fil.size, type: 'fil' });
    return true;
  }

  /* Demo-lyden: 16 takter ved 120 BPM (32 sekunder) med kick, snare, hihat, bas og en lille melodi.
     Den regnes direkte ud som tal, så den er ens hver gang. Run 2 får en rigtig lydgenerator. */
  function lavDemoLyd() {
    try { sikrCtx(); } catch (e) { return false; }
    indlaesId++;
    const sr = ctx.sampleRate, bpm = 120, slag = 60 / bpm, takter = 16;
    const n = Math.round(sr * slag * 4 * takter);
    const buf = ctx.createBuffer(2, n, sr), L = buf.getChannelData(0), R = buf.getChannelData(1);
    const TO_PI = Math.PI * 2;
    let froe = 20261120;
    const stoej = () => { froe = (froe * 1664525 + 1013904223) >>> 0; return froe / 2147483648 - 1; };
    /* Læg en lyd ind fra tiden t0. pan: −1 er venstre, 0 midt, 1 højre. */
    function laeg(t0, laengde, pan, fn) {
      const i0 = Math.round(t0 * sr), m = Math.min(n - i0, Math.round(laengde * sr));
      const gl = Math.cos((pan + 1) * Math.PI / 4), gr = Math.sin((pan + 1) * Math.PI / 4);
      for (let i = 0; i < m; i++) { const v = fn(i / sr); L[i0 + i] += v * gl; R[i0 + i] += v * gr; }
    }
    const kick = t => Math.sin(TO_PI * (46 * t + (110 / 30) * (1 - Math.exp(-30 * t)))) * Math.exp(-7 * t) * 0.95;
    const snare = t => (stoej() * 0.42 + Math.sin(TO_PI * 190 * t) * 0.3) * Math.exp(-17 * t);
    const hihat = () => { let forrige = 0; return t => { const s = stoej(), v = s - forrige; forrige = s; return v * Math.exp(-75 * t) * 0.16; }; };
    const bas = f => t => (Math.sin(TO_PI * f * t) + 0.35 * Math.sin(TO_PI * 2 * f * t) + 0.15 * Math.sin(TO_PI * 3 * f * t)) * Math.min(1, t * 200) * Math.exp(-3.2 * t) * 0.34;
    const tone = f => t => (Math.sin(TO_PI * f * t) + 0.25 * Math.sin(TO_PI * 2 * f * t)) * Math.min(1, t * 400) * Math.exp(-9 * t) * 0.13;
    const akkorder = [[55, 220, 261.63, 329.63], [43.65, 174.61, 220, 261.63], [65.41, 196, 261.63, 329.63], [49, 196, 246.94, 293.66]];
    for (let takt = 0; takt < takter; takt++) {
      const t0 = takt * 4 * slag, del = Math.floor(takt / 4), ak = akkorder[takt % 4];
      const medKick = del !== 2, medSnare = del === 1 || del === 3, medMelodi = del >= 1;
      for (let s = 0; s < 4; s++) {
        const ts = t0 + s * slag;
        if (medKick) laeg(ts, 0.5, 0, kick);
        if (medSnare && (s === 1 || s === 3)) laeg(ts, 0.3, 0.1, snare);
        laeg(ts, 0.1, 0.35, hihat());
        laeg(ts + slag / 2, 0.1, -0.35, hihat());
        laeg(ts, slag * 0.9, 0, bas(s === 3 ? ak[0] * 1.5 : ak[0]));
        if (medMelodi) for (let k = 0; k < 4; k++) laeg(ts + k * slag / 4, 0.4, k % 2 ? 0.7 : -0.7, tone(ak[1 + ((s + k) % 3)] * (k === 3 ? 2 : 1)));
      }
    }
    let top = 0;
    for (let i = 0; i < n; i++) { const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > top) top = a; }
    /* Blød begrænsning (fagudtryk: soft clipping med tanh), så lyden fylder som en færdig sang; top cirka 0,87. */
    const g = top > 0 ? 1.8 / top : 1, ud = Math.round(sr * 0.02);
    for (let i = 0; i < n; i++) {
      const f = (i > n - ud ? (n - i) / ud : 1) * 0.92;
      L[i] = Math.tanh(L[i] * g) * f; R[i] = Math.tanh(R[i] * g) * f;
    }
    brugBuffer(buf, { navn: 'demo', type: 'demo', stoerrelse: 0, forslag: { gitter: { bpm, start: 0, slagPrTakt: 4, kilde: 'demo' } } });
    return true;
  }

  return {
    indlaesFil, lavDemoLyd, afspil, pause, skift, stop, soeg, flyt, position,
    saetLoopPunkt, saetLoopOmraade, rydLoopPunkter, skiftLoop, loopOmraade,
    tilstand: () => tilstand,
    harSang: () => !!buffer,
    varighed: () => (buffer ? buffer.duration : 0),
    meta: () => meta,
    maaler: () => maaler
  };
})();
/* ========== SLUT: AUDIO ========== */
</script>

<script data-modul="analyse">
/* ========== ANALYSE (Run 1): bølgeform, niveau og tempo-gitter ==========
   1) Bølgeformen: sangen måles i små blokke (mindste, højeste og middel-energi), og blokkene lægges
      sammen i flere lag, så tidslinjen kan tegne hurtigt ved alle zoom (fagudtryk: mipmap eller peak-pyramide).
   2) Niveauet, mens der spilles: RMS (fagudtryk: root mean square, den gennemsnitlige styrke) og top.
   3) Tempo-gitteret: slag og takter ud fra et tempo, som i Run 1 sættes i hånden eller med Tap.
   Run 2 bygger resten af analysen ind her.
   Beskeder: 'analyse:fremskridt' {del, p}, 'analyse:boelgeform' boelge. */
'use strict';
RS.Analyse = (() => {
  const { Events, State, util } = RS;
  const BLOK = 64;                       // samples pr. blok i det fineste lag

  /* ---------- 1) Bølgeform ---------- */
  let boelgeId = 0;
  async function beregnBoelgeform(buffer) {
    const id = ++boelgeId;
    const n = buffer.length, antalKan = buffer.numberOfChannels, kan = [];
    for (let c = 0; c < antalKan; c++) kan.push(buffer.getChannelData(c));
    const antal = Math.ceil(n / BLOK);
    const min = new Float32Array(antal), max = new Float32Array(antal), kv = new Float32Array(antal);
    const BID = 4096;                    // blokke pr. bid, før vi ser på uret
    let sidstePause = performance.now(), top = 0;
    for (let b0 = 0; b0 < antal; b0 += BID) {
      const b1 = Math.min(antal, b0 + BID);
      for (let b = b0; b < b1; b++) {
        const i0 = b * BLOK, i1 = Math.min(n, i0 + BLOK);
        let mn = 1e9, mx = -1e9, sum = 0;
        for (let c = 0; c < antalKan; c++) {
          const d = kan[c];
          for (let i = i0; i < i1; i++) { const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; sum += v * v; }
        }
        min[b] = mn; max[b] = mx; kv[b] = sum / ((i1 - i0) * antalKan);
        if (mx > top) top = mx;
        if (-mn > top) top = -mn;
      }
      /* Giv browseren luft cirka 40 gange i sekundet, så vinduet ikke fryser ved lange sange. */
      if (performance.now() - sidstePause > 24) {
        Events.emit('analyse:fremskridt', { del: 'boelgeform', p: b1 / antal });
        await new Promise(r => setTimeout(r, 0));
        if (id !== boelgeId) return null;           // en ny sang er åbnet imens
        sidstePause = performance.now();
      }
    }
    const lag = [{ blok: BLOK, antal, min, max, kv }];
    while (lag[lag.length - 1].antal > 1024) {
      const f = lag[lag.length - 1], a2 = Math.ceil(f.antal / 2);
      const mn2 = new Float32Array(a2), mx2 = new Float32Array(a2), kv2 = new Float32Array(a2);
      for (let j = 0; j < a2; j++) {
        const p = 2 * j, q = p + 1 < f.antal ? p + 1 : p;
        mn2[j] = f.min[p] < f.min[q] ? f.min[p] : f.min[q];
        mx2[j] = f.max[p] > f.max[q] ? f.max[p] : f.max[q];
        kv2[j] = (f.kv[p] + f.kv[q]) / 2;
      }
      lag.push({ blok: f.blok * 2, antal: a2, min: mn2, max: mx2, kv: kv2 });
    }
    return { sr: buffer.sampleRate, n, varighed: buffer.duration, kan, lag, top };
  }

  /* Én søjle pr. billedpunkt: højeste, laveste og RMS for udsnittet fra "start" med "ppsEnhed" søjler pr. sekund.
     Resultatet skrives i ud.top, ud.bund og ud.rms (Float32Array med mindst W pladser). */
  function soejler(boelge, start, ppsEnhed, W, ud) {
    const spk = boelge.sr / ppsEnhed;                // samples pr. søjle
    const s0 = start * boelge.sr, n = boelge.n, antalKan = boelge.kan.length;
    if (spk < BLOK) {                                // zoomet helt ind: læs de rigtige samples
      for (let x = 0; x < W; x++) {
        let i0 = Math.floor(s0 + x * spk), i1 = Math.floor(s0 + (x + 1) * spk);
        if (i1 <= i0) i1 = i0 + 1;
        if (i1 <= 0 || i0 >= n) { ud.top[x] = ud.bund[x] = ud.rms[x] = 0; continue; }   // før start eller efter slut: stilhed
        if (i0 < 0) i0 = 0;
        if (i1 > n) i1 = n;
        let mn = 1e9, mx = -1e9, sum = 0;
        for (let c = 0; c < antalKan; c++) {
          const d = boelge.kan[c];
          for (let i = i0; i < i1; i++) { const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; sum += v * v; }
        }
        ud.top[x] = mx; ud.bund[x] = mn; ud.rms[x] = Math.sqrt(sum / ((i1 - i0) * antalKan));
      }
      return;
    }
    const li = Math.min(boelge.lag.length - 1, Math.floor(Math.log2(spk / BLOK)));
    const lg = boelge.lag[li], bs = lg.blok;
    for (let x = 0; x < W; x++) {
      let j0 = Math.floor((s0 + x * spk) / bs), j1 = Math.floor((s0 + (x + 1) * spk) / bs);
      if (j1 <= j0) j1 = j0 + 1;
      if (j1 <= 0 || j0 >= lg.antal) { ud.top[x] = ud.bund[x] = ud.rms[x] = 0; continue; }
      if (j0 < 0) j0 = 0;
      if (j1 > lg.antal) j1 = lg.antal;
      let mn = 1e9, mx = -1e9, sum = 0;
      for (let j = j0; j < j1; j++) { if (lg.min[j] < mn) mn = lg.min[j]; if (lg.max[j] > mx) mx = lg.max[j]; sum += lg.kv[j]; }
      ud.top[x] = mx; ud.bund[x] = mn; ud.rms[x] = Math.sqrt(sum / (j1 - j0));
    }
  }

  Events.on('audio:indlaest', async ({ buffer }) => {
    Events.emit('analyse:fremskridt', { del: 'boelgeform', p: 0 });
    const boelge = await beregnBoelgeform(buffer);
    if (boelge) Events.emit('analyse:boelgeform', boelge);
  });

  /* ---------- 2) Niveau, mens der spilles ---------- */
  const HIST = 600;                       // cirka 20 sekunder ved 30 målinger i sekundet
  const live = {
    rms: 0, top: 0,                       // seneste rå måling (0 til 1)
    glat: 0, hold: 0,                     // udjævnet RMS og top, der holdes lidt
    rmsDb: -Infinity, holdDb: -Infinity,
    historik: new Float32Array(HIST), histPos: 0
  };
  let maalBuf = null, sidstMaalt = 0, holdTid = 0;
  /* Kaldes én gang pr. billede. Selve målingen sker højst 33 gange i sekundet (fagudtryk: throttling). */
  function opdaterLive(dt, nu) {
    const an = RS.Audio.maaler(), spiller = RS.Audio.tilstand() === 'spiller';
    if (nu - sidstMaalt >= 30) {
      sidstMaalt = nu;
      let rms = 0, top = 0;
      if (an && spiller) {
        if (!maalBuf || maalBuf.length !== an.fftSize) maalBuf = new Float32Array(an.fftSize);
        an.getFloatTimeDomainData(maalBuf);
        let sum = 0;
        for (let i = 0; i < maalBuf.length; i++) { const v = maalBuf[i]; sum += v * v; const a = v < 0 ? -v : v; if (a > top) top = a; }
        rms = Math.sqrt(sum / maalBuf.length);
      }
      live.rms = rms; live.top = top;
      if (spiller || live.glat > 0) { live.historik[live.histPos] = live.glat; live.histPos = (live.histPos + 1) % HIST; }
    }
    /* Udjævning: hurtigt op (30 ms), langsommere ned (250 ms). Fagudtryk: envelope follower med attack og release. */
    const tau = live.rms > live.glat ? 0.03 : 0.25;
    live.glat += (live.rms - live.glat) * (1 - Math.exp(-dt / tau));
    if (live.top >= live.hold) { live.hold = live.top; holdTid = 0.8; }
    else if (holdTid > 0) holdTid -= dt;
    else live.hold *= Math.exp(-dt * 2.3);            // falder cirka 20 dB i sekundet
    if (live.glat < 1e-5) live.glat = 0;
    if (live.hold < 1e-5) live.hold = 0;
    live.rmsDb = util.dB(live.glat);
    live.holdDb = util.dB(live.hold);
  }
  function nulstilLive() { live.historik.fill(0); live.histPos = 0; live.glat = live.hold = live.rms = live.top = 0; }
  Events.on('audio:indlaest', nulstilLive);

  /* ---------- 3) Tempo-gitter og snap ---------- */
  /* Flyt en tid til nærmeste slag eller takt. tilstand: 'slag' eller 'takt'; udeladt = det, der er valgt på tidslinjen. */
  function snap(t, tilstand) {
    const m = tilstand || State.hent('tidslinje.snap'), g = State.hent('sang.gitter');
    if (m === 'fra' || !g.bpm) return t;
    const enhed = (60 / g.bpm) * (m === 'takt' ? g.slagPrTakt : 1);
    return g.start + Math.round((t - g.start) / enhed) * enhed;
  }
  function saetTempo(bpm, kilde) {
    const g = Object.assign({}, State.hent('sang.gitter'));
    g.bpm = bpm == null || !isFinite(bpm) ? null : Math.round(util.klem(bpm, 30, 300) * 10) / 10;
    g.kilde = g.bpm ? kilde : null;
    State.saet('sang.gitter', g);
  }
  /* Tap: tryk i takt. Fra tredje tryk regnes tempoet som gennemsnittet af afstandene.
     Spiller sangen, bliver det første tryk til takt 1. Efter 2 sekunders pause begynder man forfra. */
  let tapTider = [], tapStart = 0;
  function tap() {
    const nu = performance.now();
    if (tapTider.length && nu - tapTider[tapTider.length - 1] > 2000) tapTider = [];
    if (!tapTider.length) tapStart = RS.Audio.tilstand() === 'spiller' ? RS.Audio.position() : null;
    tapTider.push(nu);
    if (tapTider.length > 12) tapTider.shift();
    if (tapTider.length >= 3) {
      const afstand = (tapTider[tapTider.length - 1] - tapTider[0]) / (tapTider.length - 1);
      const g = Object.assign({}, State.hent('sang.gitter'));
      g.bpm = Math.round(util.klem(60000 / afstand, 30, 300) * 10) / 10;
      g.kilde = 'tap';
      if (tapStart != null) g.start = tapStart;
      State.saet('sang.gitter', g);
    }
    Events.emit('analyse:tap', { antal: tapTider.length, mangler: Math.max(0, 3 - tapTider.length) });
  }

  return { beregnBoelgeform, soejler, live, opdaterLive, snap, saetTempo, tap, BLOK };
})();
/* ========== SLUT: ANALYSE ========== */
</script>

<script data-modul="rendering">
/* ========== RENDERING: billed-løkken og Live preview ==========
   Én løkke (requestAnimationFrame) kalder alle tegnere med delta-tid (dt = sekunder siden sidste billede).
   En tegner tegner kun, når noget har ændret sig. Live preview i Run 1: en cirkel, der følger niveauet. */
'use strict';
RS.Rendering = (() => {
  const { Events } = RS;
  const tegnere = [], fejlMeldt = new Set();
  let sidst = 0, fps = 0, koerer = false;

  function tilfoej(navn, fn) { tegnere.push({ navn, fn }); }
  function loekke(nu) {
    const dt = sidst ? Math.min(0.1, (nu - sidst) / 1000) : 1 / 60;
    sidst = nu;
    if (dt > 0) fps = fps ? fps + (1 / dt - fps) * 0.05 : 1 / dt;
    RS.Analyse.opdaterLive(dt, nu);
    for (const t of tegnere) {
      try { t.fn(dt, nu); }
      catch (e) { if (!fejlMeldt.has(t.navn)) { fejlMeldt.add(t.navn); console.error('[RS.Rendering] ' + t.navn, e); Events.emit('fejl', e); } }
    }
    requestAnimationFrame(loekke);
  }
  function start() { if (!koerer) { koerer = true; requestAnimationFrame(loekke); } }

  /* Giv et lærred (canvas) samme antal billedpunkter som skærmen viser. Giver {b, h, dpr, aendret} i CSS-mål. */
  function tilpasLaerred(l, maksDpr = 2) {
    const dpr = Math.min(maksDpr, window.devicePixelRatio || 1);
    const b = l.clientWidth, h = l.clientHeight;
    const pb = Math.max(1, Math.round(b * dpr)), ph = Math.max(1, Math.round(h * dpr));
    const aendret = l.width !== pb || l.height !== ph;
    if (aendret) { l.width = pb; l.height = ph; }
    return { b, h, dpr, aendret };
  }

  /* ---------- Live preview ---------- */
  const TO_PI = Math.PI * 2;
  let pv = null, pvC = null, pvSnavset = true;
  const n01 = db => (db <= -54 ? 0 : db >= 0 ? 1 : (db + 54) / 54);      // −54 dB … 0 dB → 0 … 1

  function tegnPreview(dt, nu) {
    const L = RS.Analyse.live;
    const aktiv = RS.Audio.tilstand() === 'spiller' || L.glat > 0 || L.hold > 0;
    if (!aktiv && !pvSnavset) return;
    pvSnavset = aktiv;                                  // ét billede mere, når lyden er faldet til ro
    const m = tilpasLaerred(pv), c = pvC, b = m.b, h = m.h;
    c.setTransform(m.dpr, 0, 0, m.dpr, 0, 0);
    c.clearRect(0, 0, b, h);
    if (!RS.Audio.harSang()) return;
    const figur = RS.Stil.nu().preview;
    if (figur === 'ring') return tegnRing(c, b, h, L);
    if (figur === 'vu') return tegnVu(c, b, h, L);

    const niv = n01(L.rmsDb), top = n01(L.holdDb);
    const cx = b / 2, cy = h * 0.44, R0 = Math.min(b, h) * 0.12, R = R0 * (1 + niv * 0.9);
    /* Glød */
    const g = c.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 2.8);
    g.addColorStop(0, 'rgba(79,224,200,' + (0.04 + 0.4 * niv) + ')');
    g.addColorStop(1, 'rgba(79,224,200,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(cx, cy, R * 2.8, 0, TO_PI); c.fill();
    /* Cirklen */
    const k = c.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.05, cx, cy, R);
    k.addColorStop(0, 'rgba(220,255,247,' + (0.22 + 0.74 * niv) + ')');
    k.addColorStop(0.55, 'rgba(79,224,200,' + (0.16 + 0.66 * niv) + ')');
    k.addColorStop(1, 'rgba(28,98,100,' + (0.24 + 0.5 * niv) + ')');
    c.fillStyle = k;
    c.beginPath(); c.arc(cx, cy, R, 0, TO_PI); c.fill();
    c.lineWidth = 1.5;
    c.strokeStyle = 'rgba(165,246,230,' + (0.3 + 0.55 * niv) + ')';
    c.stroke();
    /* Top-ringen: den højeste top, holdt et øjeblik */
    if (top > 0) {
      c.lineWidth = 1;
      c.strokeStyle = 'rgba(220,255,247,' + (0.12 + 0.5 * top) + ')';
      c.beginPath(); c.arc(cx, cy, R0 * (1 + top * 0.9) + 12, 0, TO_PI); c.stroke();
    }
    /* Niveauet de sidste cirka 20 sekunder (nyest til højre) */
    const hist = L.historik, N = hist.length, hb = Math.min(h * 0.09, 64) / 2, yc = h - 46 - hb;
    const farve = c.createLinearGradient(0, 0, b, 0);
    farve.addColorStop(0, 'rgba(79,224,200,0.02)');
    farve.addColorStop(1, 'rgba(79,224,200,0.26)');
    c.fillStyle = farve;
    c.beginPath();
    for (let i = 0; i < N; i++) { const v = n01(RS.util.dB(hist[(L.histPos + i) % N])) * hb; const x = (b * i) / (N - 1); if (i) c.lineTo(x, yc - v); else c.moveTo(x, yc - v); }
    for (let i = N - 1; i >= 0; i--) { const v = n01(RS.util.dB(hist[(L.histPos + i) % N])) * hb; c.lineTo((b * i) / (N - 1), yc + v + 1); }
    c.closePath(); c.fill();
  }

  /* Stilen Neon: en lysende ring. Strålerne rundt om er niveauet de sidste 20 sekunder (nyest øverst, med uret bagud). */
  function tegnRing(c, b, h, L) {
    const niv = n01(L.rmsDb), top = n01(L.holdDb), cx = b / 2, cy = h * 0.5, R0 = Math.min(b, h) * 0.17, R = R0 * (1 + niv * 0.22);
    const hist = L.historik, N = 120, trin = hist.length / N, maks = Math.min(b, h) * 0.2;
    const farve = (f, a) => 'rgba(' + Math.round(45 + 210 * f) + ',' + Math.round(226 - 131 * f) + ',' + Math.round(255 - 87 * f) + ',' + a + ')';
    const g = c.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 3);
    g.addColorStop(0, 'rgba(122,92,255,' + (0.1 + 0.3 * niv) + ')'); g.addColorStop(0.45, 'rgba(255,95,168,' + 0.12 * niv + ')'); g.addColorStop(1, 'rgba(45,226,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R * 3, 0, TO_PI); c.fill();
    c.lineCap = 'round';
    for (let pas = 0; pas < 2; pas++) {
      c.lineWidth = pas ? Math.max(2, R0 * 0.022) : Math.max(6, R0 * 0.07);
      for (let i = 0; i < N; i++) {
        const v = n01(RS.util.dB(hist[(L.histPos - 1 - Math.floor(i * trin) + hist.length * 2) % hist.length]));
        if (v <= 0.01) continue;
        const vink = -Math.PI / 2 + (i / N) * TO_PI, f = Math.abs(1 - (2 * i) / N), r1 = R + R0 * 0.14, r2 = r1 + v * maks * (1 - 0.45 * (i / N));
        c.strokeStyle = farve(1 - f, pas ? 0.95 - 0.6 * (i / N) : 0.14);
        c.beginPath(); c.moveTo(cx + Math.cos(vink) * r1, cy + Math.sin(vink) * r1); c.lineTo(cx + Math.cos(vink) * r2, cy + Math.sin(vink) * r2); c.stroke();
      }
    }
    const kant = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    kant.addColorStop(0, '#2de2ff'); kant.addColorStop(0.5, '#7a5cff'); kant.addColorStop(1, '#ff5fa8');
    c.strokeStyle = kant; c.globalAlpha = 0.25 + 0.3 * niv; c.lineWidth = R0 * 0.16;
    c.beginPath(); c.arc(cx, cy, R, 0, TO_PI); c.stroke();
    c.globalAlpha = 1; c.lineWidth = Math.max(3, R0 * 0.045);
    c.beginPath(); c.arc(cx, cy, R, 0, TO_PI); c.stroke();
    const k = c.createRadialGradient(cx, cy, 0, cx, cy, R);
    k.addColorStop(0, 'rgba(241,238,255,' + (0.05 + 0.5 * niv * niv) + ')'); k.addColorStop(0.7, 'rgba(122,92,255,' + (0.05 + 0.2 * niv) + ')'); k.addColorStop(1, 'rgba(20,17,40,0)');
    c.fillStyle = k; c.beginPath(); c.arc(cx, cy, R, 0, TO_PI); c.fill();
    if (top > 0) { c.strokeStyle = 'rgba(255,224,102,' + (0.15 + 0.6 * top) + ')'; c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy, R0 * 1.36 + top * maks, 0, TO_PI); c.stroke(); }
    c.fillStyle = '#f1eeff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '600 ' + Math.round(R0 * 0.36) + 'px ' + skriftTal();
    c.fillText(isFinite(L.rmsDb) ? RS.util.talTekst(L.rmsDb, 1) : '−∞', cx, cy - R0 * 0.04);
    c.font = Math.round(Math.max(11, R0 * 0.1)) + 'px ' + skriftTal(); c.fillStyle = '#a79fd0';
    c.fillText('RMS dB', cx, cy + R0 * 0.26);
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  }

  /* Stilen Analog: et VU-meter (fagudtryk: volume unit meter) med viser. Skalaen er dB fra −40 til 0; rødt felt fra −6. */
  function tegnVu(c, b, h, L) {
    const Bm = Math.min(b * 0.62, h * 1.25, 1100), Hm = Bm * 0.56, x0 = (b - Bm) / 2, y0 = (h - Hm) / 2 - h * 0.02, e = Bm / 100;
    const vinkel = db => (-50 + (Math.max(-40, Math.min(1.5, db)) + 40) / 40 * 100) * Math.PI / 180;   // −40 dB = −50°, 0 dB = +50°
    /* Kabinet og skive */
    c.fillStyle = '#0f0c09'; c.beginPath(); c.roundRect(x0 - 2.2 * e, y0 - 2.2 * e + 0.8 * e, Bm + 4.4 * e, Hm + 4.4 * e, 2.4 * e); c.fill();
    const ramme = c.createLinearGradient(0, y0 - 2 * e, 0, y0 + Hm + 2 * e);
    ramme.addColorStop(0, '#4a4033'); ramme.addColorStop(1, '#2a241c');
    c.fillStyle = ramme; c.beginPath(); c.roundRect(x0 - 2.2 * e, y0 - 2.2 * e, Bm + 4.4 * e, Hm + 4.4 * e, 2.4 * e); c.fill();
    const skive = c.createRadialGradient(b / 2, y0 + Hm * 0.25, Hm * 0.1, b / 2, y0 + Hm * 0.5, Bm * 0.72);
    skive.addColorStop(0, '#fbf1d6'); skive.addColorStop(0.6, '#f0e2bd'); skive.addColorStop(1, '#cdb98a');
    c.fillStyle = skive; c.beginPath(); c.roundRect(x0, y0, Bm, Hm, 1.2 * e); c.fill();
    c.save(); c.beginPath(); c.roundRect(x0, y0, Bm, Hm, 1.2 * e); c.clip();
    const px = b / 2, py = y0 + Hm * 1.02, Rs = Hm * 0.78;                 // viserens omdrejningspunkt og skalaens radius
    const pkt = (db, r) => { const a = vinkel(db) - Math.PI / 2; return [px + Math.cos(a) * r, py + Math.sin(a) * r]; };
    /* Skalaens bue: sort til −6 dB, rød derfra */
    c.lineWidth = 0.45 * e; c.strokeStyle = '#2a221a';
    c.beginPath(); c.arc(px, py, Rs, vinkel(-40) - Math.PI / 2, vinkel(-6) - Math.PI / 2); c.stroke();
    c.strokeStyle = '#c8371c'; c.lineWidth = 1.5 * e;
    c.beginPath(); c.arc(px, py, Rs + 0.52 * e, vinkel(-6) - Math.PI / 2, vinkel(0) - Math.PI / 2); c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let db = -40; db <= 0; db++) {
      const stor = db % 10 === 0 || db === -6 || db === -3, mellem = db % 5 === 0;
      if (!stor && !mellem && db < -20 && db % 2) continue;
      const p1 = pkt(db, Rs), p2 = pkt(db, Rs + (stor ? 3.4 : mellem ? 2.4 : 1.5) * e);
      c.strokeStyle = db >= -6 ? '#c8371c' : '#2a221a'; c.lineWidth = (stor ? 0.5 : 0.28) * e;
      c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(p2[0], p2[1]); c.stroke();
      if (stor) { const pt = pkt(db, Rs + 6.6 * e); c.fillStyle = db >= -6 ? '#c8371c' : '#2a221a'; c.font = '600 ' + 3.3 * e + 'px ' + skriftTal(); c.fillText(String(db).replace('-', '−'), pt[0], pt[1]); }
    }
    c.fillStyle = '#2a221a'; c.font = 'italic ' + 5.2 * e + 'px Georgia, "Times New Roman", serif';
    c.fillText('RMS', px, y0 + Hm * 0.6);
    c.font = 2.5 * e + 'px ' + skriftTal(); c.fillStyle = '#6b5c45';
    c.fillText('dB  ·  Rytme Studio', px, y0 + Hm * 0.7);
    /* Viseren, med skygge */
    const a = vinkel(isFinite(L.rmsDb) ? L.rmsDb : -60) - Math.PI / 2, laengde = Rs + 2.2 * e;
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(60,40,20,0.22)'; c.lineWidth = 0.7 * e;
    c.beginPath(); c.moveTo(px + 0.9 * e, py + 0.9 * e); c.lineTo(px + Math.cos(a) * laengde + 0.9 * e, py + Math.sin(a) * laengde + 0.9 * e); c.stroke();
    c.strokeStyle = '#1c1611'; c.lineWidth = 0.42 * e;
    c.beginPath(); c.moveTo(px, py); c.lineTo(px + Math.cos(a) * laengde, py + Math.sin(a) * laengde); c.stroke();
    c.restore();
    /* Dæksel over omdrejningspunktet og top-lampen */
    const daek = c.createLinearGradient(0, y0 + Hm * 0.84, 0, y0 + Hm);
    daek.addColorStop(0, '#3a3127'); daek.addColorStop(1, '#221c15');
    c.fillStyle = daek; c.beginPath(); c.roundRect(x0, y0 + Hm * 0.84, Bm, Hm * 0.16, [0, 0, 1.2 * e, 1.2 * e]); c.fill();
    c.fillStyle = '#b8aa90'; c.font = 2.4 * e + 'px ' + skriftTal(); c.textAlign = 'left';
    c.fillText((isFinite(L.rmsDb) ? RS.util.talTekst(L.rmsDb, 1) : '−∞') + ' dB RMS', x0 + 3 * e, y0 + Hm * 0.92);
    c.textAlign = 'right';
    c.fillText('Top ' + (isFinite(L.holdDb) ? RS.util.talTekst(L.holdDb, 1) : '−∞') + ' dB', x0 + Bm - 8 * e, y0 + Hm * 0.92);
    const taendt = L.holdDb > -1, lx = x0 + Bm - 4.2 * e, ly = y0 + Hm * 0.92;
    if (taendt) { const gl = c.createRadialGradient(lx, ly, 0, lx, ly, 6 * e); gl.addColorStop(0, 'rgba(255,93,58,0.7)'); gl.addColorStop(1, 'rgba(255,93,58,0)'); c.fillStyle = gl; c.beginPath(); c.arc(lx, ly, 6 * e, 0, TO_PI); c.fill(); }
    c.fillStyle = taendt ? '#ff7a55' : '#5a2a1e'; c.beginPath(); c.arc(lx, ly, 1.5 * e, 0, TO_PI); c.fill();
    c.strokeStyle = '#0f0c09'; c.lineWidth = 0.3 * e; c.stroke();
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  }
  const skriftTal = () => getComputedStyle(document.documentElement).getPropertyValue('--skrift-tal') || 'sans-serif';

  function startPreview(laerred) {
    pv = laerred; pvC = pv.getContext('2d');
    new ResizeObserver(() => { pvSnavset = true; }).observe(pv);
    Events.on('audio:indlaest', () => { pvSnavset = true; });
    Events.on('stil:skiftet', () => { pvSnavset = true; });
    tilfoej('preview', tegnPreview);
  }

  return { tilfoej, start, tilpasLaerred, startPreview, fps: () => fps, n01 };
})();
/* ========== SLUT: RENDERING ========== */
</script>

<script data-modul="tidslinje">
/* ========== TIDSLINJE: bølgeform med zoom, snap, følg afspilning og loop ==========
   Øverst en smal oversigt over hele sangen; under den det udsnit, der er zoomet ind på.
   Udsnittet er to tal: start (sekunder ved venstre kant) og pps (billedpunkter pr. sekund).
   Mus: klik eller træk = søg · Shift + træk = markér loop A til B · træk håndtagene A og B ·
        hjul = zoom ved musen · Shift + hjul = rul til siden · Alt = uden snap.
   Besked: 'tidslinje:visning' {start, pps, minPps, maksPps, synlig}. */
'use strict';
RS.Tidslinje = (() => {
  const { Events, State, util } = RS;
  const MAKS_PPS = 4000, LINEAL = 26, FOELG_PLADS = 0.3;   // stregen holdes 30 % inde i billedet
  let F = RS.Stil.nu();                                    // farver og form fra den valgte stil
  let laerred, c, oversigt, oc, skrift = 'sans-serif';
  let boelge = null, varighed = 0;
  let start = 0, pps = 100, passerAlt = true;
  let B = 0, H = 0, dpr = 1;                               // lærredets mål i CSS-punkter
  let snavset = true, sidstPos = -1, sidstSpiller = false;
  let flise = null;                                        // bølgeformen malet som billede (bredere end udsnittet)
  let oBillede = null, oBoelge = null;                     // det samme for oversigten
  let traek = null;                                        // {type:'soeg'|'marker'|'a'|'b'|'oversigt', …}
  let midlLoop = null;                                     // loop, mens der trækkes (ikke gemt endnu)
  let musX = -1, sidsteSoeg = 0;

  const minPps = () => (varighed > 0 && B > 0 ? B / varighed : 1);
  const synlig = () => B / pps;                            // sekunder i billedet
  const tidTilX = t => (t - start) * pps;
  const xTilTid = x => start + x / pps;

  function saetVisning(nyPps, nyStart) {
    const mn = minPps();
    pps = util.klem(nyPps, mn, Math.max(mn, MAKS_PPS));
    passerAlt = pps <= mn * 1.0005;
    start = util.klem(nyStart, 0, Math.max(0, varighed - B / pps));
    snavset = true;
    Events.emit('tidslinje:visning', { start, pps, minPps: mn, maksPps: Math.max(mn, MAKS_PPS), synlig: synlig() });
  }
  /* Zoom med en faktor omkring et punkt på skærmen (ankerX i CSS-punkter). */
  function zoom(faktor, ankerX) {
    if (!boelge) return;
    if (ankerX == null) { const px = tidTilX(RS.Audio.position()); ankerX = px >= 0 && px <= B ? px : B / 2; }
    const t = xTilTid(ankerX), mn = minPps(), ny = util.klem(pps * faktor, mn, Math.max(mn, MAKS_PPS));
    saetVisning(ny, t - ankerX / ny);
  }
  function saetZoom01(v) {                                 // skyderen: 0 = hele sangen, 1 = helt ind (logaritmisk)
    if (!boelge) return;
    const mn = minPps(), mx = Math.max(mn, MAKS_PPS), px = tidTilX(RS.Audio.position());
    const ankerX = px >= 0 && px <= B ? px : B / 2, t = xTilTid(ankerX), ny = mn * Math.pow(mx / mn, util.klem(v, 0, 1));
    saetVisning(ny, t - ankerX / ny);
  }
  const zoom01 = () => { const mn = minPps(), mx = Math.max(mn, MAKS_PPS); return mx > mn ? Math.log(pps / mn) / Math.log(mx / mn) : 0; };
  function visAlt() { if (boelge) saetVisning(minPps(), 0); }
  /* Flyt udsnittet. Gør brugeren det selv, mens der spilles, slås Følg afspilning fra (og det siges i status). */
  function panorer(dSek, afBruger) {
    if (!boelge || passerAlt) return;
    saetVisning(pps, start + dSek);
    if (afBruger) slaaFoelgFra();
  }
  function slaaFoelgFra() {
    if (RS.Audio.tilstand() === 'spiller' && State.hent('tidslinje.foelg')) {
      State.saet('tidslinje.foelg', false);
      Events.emit('status', { type: 'info', noegle: 'status.foelgFra' });
    }
  }

  function snapTid(t, e) {
    const s = e && e.altKey ? t : RS.Analyse.snap(t);
    return util.klem(s, 0, varighed);
  }

  /* ---------- Bølgeformen som billede ----------
     Søjlerne males punkt for punkt i to udgaver: dæmpet (ikke spillet endnu) og lys (det spillede stykke).
     Det sker kun, når udsnittet ændrer sig. Hvert billede i løkken er derefter kun to kopieringer (drawImage);
     det er langt billigere end at fylde en polygon med tusindvis af hjørner 60 gange i sekundet. */
  function nytBillede(W, Hh) {
    const lav = () => { const l = document.createElement('canvas'); l.width = W; l.height = Hh; return l; };
    const svag = lav(), lys = lav();
    return {
      W, H: Hh, svag, lys, cS: svag.getContext('2d'), cL: lys.getContext('2d'),
      dS: new ImageData(W, Hh), dL: new ImageData(W, Hh),
      kol: { top: new Float32Array(W), bund: new Float32Array(W), rms: new Float32Array(W) },
      yT: new Float32Array(W), yB: new Float32Array(W), rT: new Float32Array(W), rB: new Float32Array(W)
    };
  }
  function malBillede(bl, x0) {
    const W = bl.W, Hh = bl.H, k = bl.kol, midt = Hh / 2, amp = Hh / 2 - 3;
    const yT = bl.yT, yB = bl.yB, rT = bl.rT, rB = bl.rB;
    /* Søjler (stilen Neon): flere billedpunkter samles til én søjle med luft imellem. Søjlerne ligger fast
       på sangens egen akse (x0), så de ikke flimrer, når udsnittet ruller. */
    if (F.form === 'soejler') {
      const sb = Math.max(1, Math.round(F.soejleB * dpr)), per = sb + Math.max(1, Math.round(F.soejleGab * dpr));
      for (let g0 = -(((x0 % per) + per) % per); g0 < W; g0 += per) {
        const xa = g0 < 0 ? 0 : g0, xb = g0 + per < W ? g0 + per : W;
        let m = 0, r = 0;
        for (let x = xa; x < xb; x++) { if (k.top[x] > m) m = k.top[x]; if (-k.bund[x] > m) m = -k.bund[x]; if (k.rms[x] > r) r = k.rms[x]; }
        for (let x = xa; x < xb; x++) { if (x - g0 < sb) { k.top[x] = m; k.bund[x] = -m; k.rms[x] = r; } else k.top[x] = NaN; }
      }
    }
    let yMin = Hh, yMax = 0;
    for (let x = 0; x < W; x++) {
      if (k.top[x] !== k.top[x]) { yT[x] = 1e9; yB[x] = -1e9; continue; }   // luft mellem søjler
      let a = midt - k.top[x] * amp, b = midt - k.bund[x] * amp;
      if (a > midt - 0.5) a = midt - 0.5;                  // stilhed tegnes som en tynd streg
      if (b < midt + 0.5) b = midt + 0.5;
      yT[x] = a; yB[x] = b; rT[x] = midt - k.rms[x] * amp; rB[x] = midt + k.rms[x] * amp;
      if (a < yMin) yMin = a;
      if (b > yMax) yMax = b;
    }
    const pS = new Uint32Array(bl.dS.data.buffer), pL = new Uint32Array(bl.dL.data.buffer);
    pS.fill(0); pL.fill(0);
    const y0 = Math.max(0, Math.floor(yMin)), y1 = Math.min(Hh, Math.ceil(yMax));
    const bl2 = (a, b, d, i) => a[i] + (b[i] - a[i]) * d;
    for (let y = y0; y < y1; y++) {
      const r0 = y * W, d = Math.min(1, Math.abs(y + 0.5 - midt) / amp);   // 0 ved midten, 1 ved kanten
      const svag = (bl2(F.lydInd, F.lydYd, d, 2) << 16) | (bl2(F.lydInd, F.lydYd, d, 1) << 8) | bl2(F.lydInd, F.lydYd, d, 0);
      const sR = bl2(F.spilInd, F.spilYd, d, 0), sG = bl2(F.spilInd, F.spilYd, d, 1), sB = bl2(F.spilInd, F.spilYd, d, 2);
      const lR = bl2(F.lysInd, F.lysYd, d, 0), lG = bl2(F.lysInd, F.lysYd, d, 1), lB = bl2(F.lysInd, F.lysYd, d, 2);
      for (let x = 0; x < W; x++) {
        const t = yT[x], b = yB[x];
        if (y + 1 <= t || y >= b) continue;
        /* dp og dr: hvor stor en del af punktet toppen og RMS dækker (0 til 1). Det giver bløde kanter. */
        const dp = (b < y + 1 ? b : y + 1) - (t > y ? t : y);
        let dr = (rB[x] < y + 1 ? rB[x] : y + 1) - (rT[x] > y ? rT[x] : y);
        if (dr < 0) dr = 0;
        pS[r0 + x] = (((dp * F.aSvag + dr * F.aSvagRms) * 255) << 24) | svag;
        const aP = dp * F.aSpil * (1 - dr), aUd = dr + aP;
        pL[r0 + x] = ((aUd * 255) << 24) | (((lB * dr + sB * aP) / aUd) << 16) | (((lG * dr + sG * aP) / aUd) << 8) | ((lR * dr + sR * aP) / aUd);
      }
    }
    bl.cS.putImageData(bl.dS, 0, 0);
    bl.cL.putImageData(bl.dL, 0, 0);
  }
  /* Sørg for, at flisen dækker udsnittet. Giver udsnittets venstre kant i billedpunkter (på sangens egen akse). */
  function sikrFlise(W, hB) {
    const enhed = pps * dpr, vx = Math.round(start * enhed);
    const FW = Math.min(8192, Math.max(W, Math.min(2 * W, Math.ceil(varighed * enhed))));
    if (flise && flise.boelge === boelge && flise.enhed === enhed && flise.bl.W === FW && flise.bl.H === hB &&
        vx >= flise.x0 && vx + W <= flise.x0 + FW) return vx;
    if (!flise || flise.bl.W !== FW || flise.bl.H !== hB) flise = { bl: nytBillede(FW, hB) };
    flise.boelge = boelge; flise.enhed = enhed;
    flise.x0 = Math.max(0, vx - ((FW - W) >> 1));
    RS.Analyse.soejler(boelge, flise.x0 / enhed, enhed, FW, flise.bl.kol);
    malBillede(flise.bl, flise.x0);
    return vx;
  }

  function linealTrin() {
    const trin = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800, 3600];
    for (const s of trin) if (s * pps >= 84) return s;
    return trin[trin.length - 1];
  }

  function tegn(pos, spiller) {
    const W = laerred.width, Hp = laerred.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, Hp);
    if (!boelge) return;
    const yB = Math.round(LINEAL * dpr), hB = Hp - yB;     // bølgeformens område i billedpunkter

    /* Tempo-gitter: takter og slag */
    const g = State.hent('sang.gitter');
    c.font = 11 * dpr + 'px ' + skrift;
    c.textBaseline = 'top';
    if (g.bpm) {
      const slag = 60 / g.bpm, slagPx = slag * pps, taktPx = slagPx * g.slagPrTakt;
      const trinSlag = slagPx >= 9 ? 1 : taktPx >= 7 ? g.slagPrTakt : 0;
      if (trinSlag) {
        let nr = Math.floor((start - g.start) / slag);
        nr -= ((nr % trinSlag) + trinSlag) % trinSlag;
        for (; ; nr += trinSlag) {
          const t = g.start + nr * slag;
          if (t > start + synlig()) break;
          if (t < 0 || t > varighed) continue;
          const erTakt = ((nr % g.slagPrTakt) + g.slagPrTakt) % g.slagPrTakt === 0;
          const x = Math.round(tidTilX(t) * dpr) + 0.5;
          c.strokeStyle = erTakt ? F.gitterTakt : F.gitterSlag;
          c.lineWidth = 1;
          c.beginPath(); c.moveTo(x, yB); c.lineTo(x, Hp); c.stroke();
          if (erTakt && taktPx >= 46 && nr >= 0) { c.fillStyle = F.tekstSvag; c.fillText(String(nr / g.slagPrTakt + 1), x + 4 * dpr, yB + 4 * dpr); }
        }
      }
    }

    /* Loop A til B (rav = tid) */
    const l = midlLoop || State.hent('sang.loop');
    const loopTaendt = l.tilstand === 'ab';
    if (l.a != null && l.b != null) {
      const xa = tidTilX(l.a) * dpr, xb = tidTilX(l.b) * dpr;
      c.fillStyle = loopTaendt ? 'rgba(' + F.tidRgb + ',0.11)' : 'rgba(' + F.tidRgb + ',0.04)';
      c.fillRect(xa, yB, xb - xa, hB);
    }

    /* Bølgeformen: hele sangen dæmpet, det spillede stykke lyst */
    const px = tidTilX(pos) * dpr;
    const sx = sikrFlise(W, hB) - flise.x0, spillet = Math.max(0, Math.min(W, Math.round(px)));
    c.drawImage(flise.bl.svag, sx, 0, W, hB, 0, yB, W, hB);
    if (spillet > 0) c.drawImage(flise.bl.lys, sx, 0, spillet, hB, 0, yB, spillet, hB);

    /* Lineal med tid */
    const trin = linealTrin(), dec = trin < 0.1 ? 2 : trin < 1 ? 1 : 0;
    c.strokeStyle = F.streg; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, yB - 0.5); c.lineTo(W, yB - 0.5); c.stroke();
    c.fillStyle = F.tekst;
    for (let t = Math.floor(start / trin) * trin; t <= start + synlig(); t += trin) {
      if (t < -1e-9 || t > varighed + 1e-9) continue;
      const x = Math.round(tidTilX(t) * dpr) + 0.5;
      c.beginPath(); c.moveTo(x, yB - 7 * dpr); c.lineTo(x, yB); c.stroke();
      c.fillText(util.tidTekst(t + 1e-7, dec), x + 5 * dpr, 6 * dpr);
    }

    /* Håndtagene A og B */
    for (const hvilket of ['a', 'b']) {
      if (l[hvilket] == null) continue;
      const x = Math.round(tidTilX(l[hvilket]) * dpr) + 0.5;
      if (x < -20 * dpr || x > W + 20 * dpr) continue;
      c.strokeStyle = loopTaendt ? 'rgba(' + F.tidRgb + ',0.85)' : 'rgba(' + F.tidRgb + ',0.4)';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, Hp); c.stroke();
      const bw = 16 * dpr, bh = 15 * dpr, bx = x - bw;      // til venstre for stregen, så tallet på linealen kan læses
      c.fillStyle = loopTaendt ? F.tid : F.haandtagSvag;
      c.beginPath(); c.roundRect(bx, 1 * dpr, bw, bh, 3 * dpr); c.fill();
      c.fillStyle = F.paaTid;
      c.font = '600 ' + 11 * dpr + 'px ' + skrift;
      c.fillText(hvilket.toUpperCase(), bx + 4.5 * dpr, 3.5 * dpr);
      c.font = 11 * dpr + 'px ' + skrift;
    }

    /* Musen: en tynd streg og tiden under den */
    if (musX >= 0 && !traek) {
      const x = Math.round(musX * dpr) + 0.5;
      c.strokeStyle = 'rgba(' + F.lysRgb + ',0.28)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x, yB); c.lineTo(x, Hp); c.stroke();
      const tekst = util.tidTekst(xTilTid(musX), 2), tb = c.measureText(tekst).width + 10 * dpr;
      const tx = Math.min(W - tb - 2, Math.max(2, x - tb / 2));
      c.fillStyle = F.musBg;
      c.beginPath(); c.roundRect(tx, Hp - 20 * dpr, tb, 16 * dpr, 4 * dpr); c.fill();
      c.fillStyle = F.musTekst;
      c.fillText(tekst, tx + 5 * dpr, Hp - 17 * dpr);
    }

    /* Afspilningsstregen (rav) med et kort lysspor bag sig, når der spilles */
    if (px >= -2 && px <= W + 2) {
      if (spiller) {
        const spor = c.createLinearGradient(px - 34 * dpr, 0, px, 0);
        spor.addColorStop(0, 'rgba(' + F.tidRgb + ',0)'); spor.addColorStop(1, 'rgba(' + F.tidRgb + ',0.20)');
        c.fillStyle = spor; c.fillRect(px - 34 * dpr, yB, 34 * dpr, hB);
      }
      c.fillStyle = F.tid;
      c.fillRect(Math.round(px) - dpr, 0, 2 * dpr, Hp);
      c.beginPath(); c.moveTo(px - 6 * dpr, 0); c.lineTo(px + 6 * dpr, 0); c.lineTo(px, 8 * dpr); c.closePath(); c.fill();
    }
  }

  function tegnOversigt(pos) {
    const W = oversigt.width, Hp = oversigt.height;
    oc.setTransform(1, 0, 0, 1, 0, 0);
    oc.clearRect(0, 0, W, Hp);
    if (!boelge) return;
    if (!oBillede || oBillede.W !== W || oBillede.H !== Hp || oBoelge !== boelge) {
      if (!oBillede || oBillede.W !== W || oBillede.H !== Hp) oBillede = nytBillede(W, Hp);
      RS.Analyse.soejler(boelge, 0, W / varighed, W, oBillede.kol);
      malBillede(oBillede, 0);
      oBoelge = boelge;
    }
    const tx = t => (t / varighed) * W;
    const l = midlLoop || State.hent('sang.loop');
    if (l.a != null && l.b != null) {
      oc.fillStyle = l.tilstand === 'ab' ? 'rgba(' + F.tidRgb + ',0.22)' : 'rgba(' + F.tidRgb + ',0.08)';
      oc.fillRect(tx(l.a), 0, Math.max(1, tx(l.b) - tx(l.a)), Hp);
    }
    const px = tx(pos), spillet = Math.max(0, Math.min(W, Math.round(px)));
    oc.drawImage(oBillede.svag, 0, 0);
    if (spillet > 0) oc.drawImage(oBillede.lys, 0, 0, spillet, Hp, 0, 0, spillet, Hp);
    /* Udsnittet, der vises i den store bølgeform */
    if (!passerAlt) {
      const x0 = tx(start), x1 = tx(start + synlig());
      oc.fillStyle = 'rgba(' + F.lysRgb + ',0.09)';
      oc.strokeStyle = 'rgba(' + F.lysRgb + ',0.55)'; oc.lineWidth = dpr;
      oc.beginPath(); oc.roundRect(x0 + 0.5, 0.5, Math.max(4 * dpr, x1 - x0) - 1, Hp - 1, 5 * dpr); oc.fill(); oc.stroke();
    }
    oc.fillStyle = F.tid;
    oc.fillRect(Math.round(px) - dpr / 2, 0, Math.max(1, dpr), Hp);
  }

  /* ---------- Ét billede ---------- */
  function billede() {
    const m = RS.Rendering.tilpasLaerred(laerred), mo = RS.Rendering.tilpasLaerred(oversigt);
    if (m.aendret || mo.aendret || m.b !== B) {
      const varPasserAlt = passerAlt;
      B = m.b; H = m.h; dpr = m.dpr;
      if (boelge) saetVisning(varPasserAlt ? minPps() : pps, varPasserAlt ? 0 : start);
      snavset = true;
    }
    const pos = RS.Audio.position(), spiller = RS.Audio.tilstand() === 'spiller';
    /* Følg afspilning: hold stregen 30 % inde i billedet */
    if (boelge && spiller && !traek && !passerAlt && State.hent('tidslinje.foelg')) {
      const maal = util.klem(pos - synlig() * FOELG_PLADS, 0, Math.max(0, varighed - synlig()));
      if (Math.abs(maal - start) > 1e-7) saetVisning(pps, maal);
    }
    if (!snavset && pos === sidstPos && spiller === sidstSpiller) return;
    snavset = false; sidstPos = pos; sidstSpiller = spiller;
    tegn(pos, spiller);
    tegnOversigt(pos);
  }

  /* ---------- Mus og fingre ---------- */
  function lokal(e, el) { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function haandtagVed(x, y) {
    if (y > LINEAL + 4) return null;
    const l = State.hent('sang.loop');
    if (l.b != null) { const xb = tidTilX(l.b); if (x >= xb - 18 && x <= xb + 4) return 'b'; }
    if (l.a != null) { const xa = tidTilX(l.a); if (x >= xa - 18 && x <= xa + 4) return 'a'; }
    return null;
  }
  function ned(e) {
    if (!boelge || e.button !== 0) return;
    const p = lokal(e, laerred), h = haandtagVed(p.x, p.y);
    laerred.setPointerCapture(e.pointerId);
    if (h) {
      traek = { type: h };
      midlLoop = Object.assign({}, State.hent('sang.loop'));
    } else if (e.shiftKey) {
      const t = snapTid(xTilTid(p.x), e);
      traek = { type: 'marker', anker: t };
      midlLoop = { tilstand: 'ab', a: t, b: t };
    } else {
      traek = { type: 'soeg' };
      RS.Audio.soeg(snapTid(xTilTid(p.x), e));
      sidsteSoeg = performance.now();
    }
    snavset = true;
  }
  function flyt(e) {
    if (!boelge) return;
    const p = lokal(e, laerred);
    musX = p.x; snavset = true;
    if (!traek) { laerred.style.cursor = haandtagVed(p.x, p.y) ? 'ew-resize' : 'crosshair'; return; }
    const t = snapTid(xTilTid(util.klem(p.x, 0, B)), e);
    if (traek.type === 'soeg') {
      /* Mens der spilles, søges der højst 20 gange i sekundet, så lyden ikke hakker. */
      const nu = performance.now();
      if (RS.Audio.tilstand() !== 'spiller' || nu - sidsteSoeg > 50) { RS.Audio.soeg(t); sidsteSoeg = nu; }
    } else if (traek.type === 'marker') {
      midlLoop = { tilstand: 'ab', a: Math.min(traek.anker, t), b: Math.max(traek.anker, t) };
    } else {
      midlLoop[traek.type] = t;
    }
  }
  function op(e) {
    if (!traek) return;
    const type = traek.type;
    traek = null;
    if (type === 'soeg') {
      const p = lokal(e, laerred);
      RS.Audio.soeg(snapTid(xTilTid(util.klem(p.x, 0, B)), e));
    } else if (midlLoop) {
      const l = midlLoop;
      midlLoop = null;
      if (type === 'marker') { if (l.b - l.a >= 0.05) RS.Audio.saetLoopOmraade(l.a, l.b); }
      else if (l.a != null && l.b != null) {
        /* Et håndtag er flyttet: loop'et beholder sin tilstand (Fra bliver ved med at være Fra). */
        const a = Math.min(l.a, l.b), b = Math.max(l.a, l.b);
        if (b - a >= 0.05) State.saet('sang.loop', { tilstand: l.tilstand, a, b });
        else Events.emit('status', { type: 'info', noegle: 'status.loopForKort' });
      }
      else State.saet('sang.loop', l);
    }
    midlLoop = null;
    snavset = true;
  }
  function hjul(e) {
    if (!boelge) return;
    e.preventDefault();
    const enhed = e.deltaMode === 1 ? 16 : 1;
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      panorer(((e.deltaX || e.deltaY) * enhed) / pps, true);
    } else {
      zoom(Math.exp(-e.deltaY * enhed * 0.0016), lokal(e, laerred).x);
    }
  }
  function oversigtFlyt(e) {
    const p = lokal(e, oversigt);
    saetVisning(pps, (p.x / oversigt.clientWidth) * varighed - synlig() / 2);
    slaaFoelgFra();
  }

  function start_(el) {
    laerred = el.laerred; c = laerred.getContext('2d');
    oversigt = el.oversigt; oc = oversigt.getContext('2d');
    skrift = getComputedStyle(document.body).fontFamily;

    laerred.addEventListener('pointerdown', ned);
    laerred.addEventListener('pointermove', flyt);
    laerred.addEventListener('pointerup', op);
    laerred.addEventListener('pointercancel', () => { traek = null; midlLoop = null; snavset = true; });
    laerred.addEventListener('pointerleave', () => { musX = -1; snavset = true; });
    laerred.addEventListener('wheel', hjul, { passive: false });
    oversigt.addEventListener('pointerdown', e => {
      if (!boelge || passerAlt || e.button !== 0) return;
      oversigt.setPointerCapture(e.pointerId);
      traek = { type: 'oversigt' };
      oversigt.style.cursor = 'grabbing';
      oversigtFlyt(e);
    });
    oversigt.addEventListener('pointermove', e => { if (traek && traek.type === 'oversigt') oversigtFlyt(e); });
    const slip = () => { if (traek && traek.type === 'oversigt') traek = null; oversigt.style.cursor = ''; };
    oversigt.addEventListener('pointerup', slip);
    oversigt.addEventListener('pointercancel', slip);

    Events.on('audio:indlaest', () => { boelge = null; varighed = 0; snavset = true; });
    Events.on('analyse:boelgeform', b => {
      boelge = b; varighed = b.varighed;
      passerAlt = true;
      saetVisning(minPps(), 0);
    });
    Events.on('audio:soegt', t => {
      snavset = true;
      /* Når der søges uden for billedet, og der ikke spilles: flyt udsnittet, så stregen kan ses. */
      if (boelge && !traek && !passerAlt && (t < start || t > start + synlig())) saetVisning(pps, t - synlig() * FOELG_PLADS);
    });
    Events.on('audio:tilstand', () => { snavset = true; });
    Events.on('i18n:sprog', () => { snavset = true; });
    Events.on('stil:skiftet', () => {
      F = RS.Stil.nu(); flise = null; oBillede = null; snavset = true;
      skrift = getComputedStyle(document.body).fontFamily;
    });
    State.lyt('sang', () => { snavset = true; });
    State.lyt('tidslinje', () => { snavset = true; });
    RS.Rendering.tilfoej('tidslinje', billede);
  }

  return {
    start: start_, zoom, saetZoom01, zoom01, visAlt, panorer, snapTid,
    visning: () => ({ start, pps, synlig: synlig(), minPps: minPps(), passerAlt }),
    tidTilX, xTilTid
  };
})();
/* ========== SLUT: TIDSLINJE ========== */
</script>

<script data-modul="ui">
/* ========== UI: topbar, sidebar, kontrolpanel, playerbar, status og filer ==========
   UI skriver brugerens valg i RS.State eller kører en kommando; det tegner sig selv ud fra RS.State
   og beskederne. UI er det eneste modul, der kender HTML-elementerne (bortset fra de to lærreder). */
'use strict';
RS.UI = (() => {
  const { Events, State, I18n, Kommandoer, util } = RS;
  const t = I18n.t, $ = id => document.getElementById(id);
  const el = {};
  const sange = [];                       // åbnet i denne omgang: {id, type:'fil'|'demo', navn, fil}
  const log = [];
  let aktivSang = null, naesteId = 1, statusNu = null;
  let soegTraekker = false, sidsteSoeg = 0, sidstTik = 0, tapMangler = 0;

  /* ---------- Små hjælpere ---------- */
  function saetTekst(e, s) { if (e.textContent !== s) e.textContent = s; }
  function fyldSkyder(e) { e.style.setProperty('--p', ((e.value - e.min) / (e.max - e.min)) * 100 + '%'); }
  function saetSkyder(e, v) { e.value = v; fyldSkyder(e); }
  const naesteBillede = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  const sangNavn = m => (m.type === 'demo' ? t('fil.demoNavn') : m.navn);
  function genvejTekst(g) {
    return g.split('+').map(d => { const n = t('tast.' + d); return n === 'tast.' + d ? d : n; }).join(' + ');
  }

  /* ---------- Status og beskedliste ---------- */
  function statusTekst(s) {
    let vars = s.vars;
    if (vars && vars.navn === 'demo') vars = Object.assign({}, vars, { navn: t('fil.demoNavn') });
    return t(s.noegle, vars);
  }
  function status(type, noegle, vars) {
    const s = { type, noegle, vars, tid: new Date() }, sidste = log[log.length - 1];
    if (sidste && sidste.type === 'arbejder') log[log.length - 1] = s;      // "arbejder" er midlertidigt: resultatet tager linjens plads
    else log.push(s);
    if (log.length > 40) log.shift();
    statusNu = s;
    tegnStatus();
  }
  function tegnStatus() {
    if (!statusNu) return;
    el.statusPrik.dataset.type = statusNu.type;
    el.status.dataset.type = statusNu.type;
    saetTekst(el.statusTekst, statusTekst(statusNu));
    if (!el.log.hidden) tegnLog();
  }
  function tegnLog() {
    el.logListe.replaceChildren(...log.map(s => {
      const li = document.createElement('li'), tid = document.createElement('time'), tekst = document.createElement('span');
      li.dataset.type = s.type;
      tid.textContent = s.tid.toLocaleTimeString(I18n.sprog(), { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      tid.className = 'tal';
      tekst.textContent = statusTekst(s);
      li.append(tid, tekst);
      return li;
    }));
    el.log.scrollTop = el.log.scrollHeight;
  }
  function visLog(vis) {
    el.log.hidden = !vis;
    el.status.setAttribute('aria-expanded', String(vis));
    if (vis) tegnLog();
  }

  /* ---------- Filer ---------- */
  function huskFil(fil) {
    let s = sange.find(x => x.fil && x.fil.name === fil.name && x.fil.size === fil.size);
    if (!s) { s = { id: naesteId++, type: 'fil', navn: fil.name, fil }; sange.push(s); }
    return s;
  }
  async function indlaesSang(s) {
    let ok;
    if (s.type === 'demo') {
      status('arbejder', 'status.demo');
      await naesteBillede();                              // så beskeden når at blive vist
      ok = RS.Audio.lavDemoLyd();
    } else {
      ok = await RS.Audio.indlaesFil(s.fil);
    }
    if (ok) aktivSang = s.id;
    else if (s.type === 'fil') { const i = sange.indexOf(s); if (i >= 0) sange.splice(i, 1); }   // kunne ikke læses: ud af listen
    tegnSangliste();
  }
  function aabnFiler(filer) {
    const nye = filer.map(huskFil);
    tegnSangliste();
    if (nye.length) indlaesSang(nye[0]);
  }
  function aabnDemo() {
    let s = sange.find(x => x.type === 'demo');
    if (!s) { s = { id: naesteId++, type: 'demo', navn: 'demo' }; sange.push(s); }
    indlaesSang(s);
  }
  function tegnSangliste() {
    el.sangBoks.hidden = sange.length < 2;
    el.sangListe.replaceChildren(...sange.map(s => {
      const li = document.createElement('li'), b = document.createElement('button'), navn = document.createElement('span');
      b.innerHTML = '<svg class="ikon"><use href="#i-node"/></svg>';
      navn.textContent = sangNavn(s);
      b.append(navn);
      b.title = sangNavn(s);
      b.setAttribute('aria-current', String(s.id === aktivSang));
      b.addEventListener('click', () => { if (s.id !== aktivSang) indlaesSang(s); });
      li.append(b);
      return li;
    }));
  }

  /* ---------- Tegn brugerfladen ud fra tilstanden ---------- */
  function tegnSang() {
    const m = RS.Audio.meta(), har = RS.Audio.harSang();
    el.previewTom.hidden = har;
    el.previewNote.hidden = !har;
    el.filInfo.hidden = !har;
    if (!har) {
      saetTekst(el.plTitel, t('fil.ingen'));
      saetTekst(el.plMeta, t('fil.ingenMeta'));
      saetTekst(el.tidIalt, util.tidTekst(0));
    } else {
      const kan = m.kanaler === 1 ? t('fil.mono') : m.kanaler === 2 ? t('fil.stereo') : t('fil.kanalerN', { n: m.kanaler });
      const rate = m.rate.toLocaleString(I18n.sprog()) + ' Hz';
      saetTekst(el.plTitel, sangNavn(m));
      saetTekst(el.plMeta, kan + ', ' + rate + (m.type === 'demo' ? ', ' + t('fil.genereret').toLowerCase() : ''));
      saetTekst(el.tidIalt, util.tidTekst(m.varighed));
      saetTekst(el.infoLaengde, util.tidTekst(m.varighed, 1));
      saetTekst(el.infoKanaler, kan);
      saetTekst(el.infoRate, rate);
      saetTekst(el.infoStoerrelse, m.type === 'demo' ? t('fil.genereret') : util.stoerrelseTekst(m.stoerrelse));
    }
    document.title = (har ? sangNavn(m) + ' · ' : '') + 'Rytme Studio ' + RS.version;
    opdaterAktiv();
  }
  function opdaterAktiv() {
    const har = RS.Audio.harSang(), l = State.hent('sang.loop'), g = State.hent('sang.gitter');
    document.querySelectorAll('[data-kraever-sang]').forEach(e => { e.disabled = !har; });
    el.loopRydKnap.disabled = !har || (l.a == null && l.b == null);
    el.tempoRydKnap.disabled = !har || !g.bpm;
    el.loopValg.querySelector('[data-loop="ab"]').disabled = !har || l.a == null || l.b == null;
  }
  function tegnAfspiller() {
    const spiller = RS.Audio.tilstand() === 'spiller';
    el.spilIkon.setAttribute('href', spiller ? '#i-pause' : '#i-afspil');
  }
  function tegnLyd() {
    const l = State.hent('lyd');
    saetSkyder(el.volumen, Math.round(l.volumen * 100));
    saetTekst(el.volTal, Math.round(l.volumen * 100) + ' %');
    el.muteKnap.setAttribute('aria-pressed', String(l.mute));
    el.muteIkon.setAttribute('href', l.mute ? '#i-lydfra' : '#i-lyd');
    el.volumen.style.opacity = el.volTal.style.opacity = l.mute ? '.4' : '';
  }
  function tegnLoop() {
    const l = State.hent('sang.loop');
    for (const b of el.loopValg.children) b.setAttribute('aria-pressed', String(b.dataset.loop === l.tilstand));
    saetTekst(el.loopATal, l.a == null ? '–' : util.tidTekst(l.a, 2));
    saetTekst(el.loopBTal, l.b == null ? '–' : util.tidTekst(l.b, 2));
    el.loopKnap.setAttribute('aria-pressed', String(l.tilstand !== 'fra'));
    opdaterAktiv();
  }
  function tegnTempo() {
    const g = State.hent('sang.gitter');
    if (document.activeElement !== el.bpmFelt) el.bpmFelt.value = g.bpm ? g.bpm : '';
    el.slagFelt.value = String(g.slagPrTakt);
    let tekst;
    if (g.bpm) {
      tekst = t('tempo.info', { bpm: util.talTekst(g.bpm, g.bpm % 1 ? 1 : 0), n: g.slagPrTakt, tid: util.tidTekst(g.start, 2) });
      if (g.kilde) tekst += ' ' + t('tempo.kilde.' + g.kilde);
    } else {
      tekst = tapMangler ? t('tempo.tapFlere', { n: tapMangler }) : t('tempo.intet');
    }
    saetTekst(el.tempoInfo, tekst);
    tegnTidslinjeValg();
    opdaterAktiv();
  }
  function tegnTidslinjeValg() {
    const tl = State.hent('tidslinje'), g = State.hent('sang.gitter');
    for (const b of el.snapValg.children) b.setAttribute('aria-pressed', String(b.dataset.snap === tl.snap));
    el.foelgKnap.setAttribute('aria-pressed', String(tl.foelg));
    el.snapHint.hidden = !(RS.Audio.harSang() && tl.snap !== 'fra' && !g.bpm);   // snap er valgt, men der er intet tempo
  }
  function tegnStil() {
    for (const b of el.stilValg.children) b.setAttribute('aria-pressed', String(b.dataset.stil === RS.Stil.id()));
    const n = 'preview.note.' + RS.Stil.id();
    el.previewNote.dataset.i18n = t(n) === n ? 'preview.note' : n;       // hver stil forklarer sin egen figur
    saetTekst(el.previewNote, t(el.previewNote.dataset.i18n));
  }
  function tegnSprog() {
    for (const b of el.sprogValg.children) b.setAttribute('aria-pressed', String(b.dataset.sprog === I18n.sprog()));
  }
  /* Tooltips på alle knapper, der kører en kommando: titel og genvej. */
  function tegnKommandoKnapper() {
    document.querySelectorAll('[data-kommando]').forEach(b => {
      const k = Kommandoer.hent(b.dataset.kommando);
      if (!k) return;
      b.title = t(k.titel) + (k.genvej ? ' (' + genvejTekst(k.genvej) + ')' : '');
      if (b.dataset.ikonknap !== undefined) b.setAttribute('aria-label', t(k.titel));
    });
    document.querySelectorAll('[data-senere]').forEach(b => { b.title = t('nav.senere', { n: b.dataset.senere }); });
  }
  function tegnGenveje() {
    const raekker = Kommandoer.liste().filter(k => k.genvej).map(k => [genvejTekst(k.genvej), t(k.titel)]);
    for (const n of ['hjul', 'shiftHjul', 'shiftTraek', 'alt']) raekker.push([t('genvej.' + n), t('genvej.' + n + 'Goer')]);
    el.genvejListe.replaceChildren(...raekker.flatMap(([tast, hvad]) => {
      const dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = tast; dd.textContent = hvad;
      return [dt, dd];
    }));
  }
  function tegnAlt() {
    tegnSprog(); tegnStil(); tegnKommandoKnapper(); tegnGenveje(); tegnSang(); tegnAfspiller(); tegnLyd(); tegnLoop(); tegnTempo();
    tegnTidslinjeValg(); tegnSangliste(); tegnStatus();
  }

  /* ---------- Det, der ændrer sig hele tiden (læses i billed-løkken) ---------- */
  function tik(dt, nu) {
    const L = RS.Analyse.live, n01 = RS.Rendering.n01;
    el.maalerFyld.style.transform = 'scaleX(' + n01(L.rmsDb).toFixed(4) + ')';
    el.maalerTop.style.left = (n01(L.holdDb) * 100).toFixed(2) + '%';
    el.maalerFyld.parentElement.style.setProperty('--niv', n01(L.rmsDb).toFixed(4));
    if (nu - sidstTik < 80) return;                       // tal og tekst: højst 12 gange i sekundet
    sidstTik = nu;
    const pos = RS.Audio.position(), varighed = RS.Audio.varighed();
    saetTekst(el.tidNu, util.tidTekst(pos, 1));
    if (!soegTraekker) saetSkyder(el.soeg, varighed > 0 ? Math.round((pos / varighed) * 1000) : 0);
    saetTekst(el.rmsTal, isFinite(L.rmsDb) ? util.talTekst(L.rmsDb, 1) : '−∞');
    saetTekst(el.peakTal, isFinite(L.holdDb) ? util.talTekst(L.holdDb, 1) : '−∞');
    saetTekst(el.fps, Math.round(RS.Rendering.fps()) + ' fps');
    const v = RS.Tidslinje.visning();
    saetTekst(el.tlUdsnit, RS.Audio.harSang() && !v.passerAlt ? util.tidTekst(v.start, 1) + ' – ' + util.tidTekst(v.start + v.synlig, 1) : '');
  }

  /* ---------- Kommandoer: alt, brugeren kan gøre ---------- */
  function registrerKommandoer() {
    const K = Kommandoer, A = RS.Audio, har = () => A.harSang();
    const her = () => RS.Tidslinje.snapTid(A.position());
    K.registrer('afspiller.skift', { titel: 'kmd.afspil', genvej: 'Space', kan: har, koer: () => A.skift() });
    K.registrer('afspiller.stop', { titel: 'kmd.stop', kan: har, koer: () => A.stop() });
    K.registrer('afspiller.tilStart', { titel: 'kmd.tilStart', genvej: 'Home', kan: har, koer: () => A.soeg(0) });
    K.registrer('afspiller.tilbage5', { titel: 'kmd.tilbage5', genvej: 'ArrowLeft', kan: har, koer: () => A.flyt(-5) });
    K.registrer('afspiller.frem5', { titel: 'kmd.frem5', genvej: 'ArrowRight', kan: har, koer: () => A.flyt(5) });
    K.registrer('afspiller.tilbage1', { titel: 'kmd.tilbage1', genvej: 'Shift+ArrowLeft', kan: har, koer: () => A.flyt(-1) });
    K.registrer('afspiller.frem1', { titel: 'kmd.frem1', genvej: 'Shift+ArrowRight', kan: har, koer: () => A.flyt(1) });
    K.registrer('lyd.mute', { titel: 'kmd.mute', genvej: 'M', koer: () => State.saet('lyd.mute', !State.hent('lyd.mute')) });
    K.registrer('loop.skift', { titel: 'kmd.loop', genvej: 'L', kan: har, koer: () => A.skiftLoop() });
    K.registrer('loop.a', { titel: 'kmd.loopA', genvej: 'A', kan: har, koer: () => A.saetLoopPunkt('a', her()) });
    K.registrer('loop.b', { titel: 'kmd.loopB', genvej: 'B', kan: har, koer: () => A.saetLoopPunkt('b', her()) });
    K.registrer('loop.ryd', { titel: 'kmd.loopRyd', kan: har, koer: () => A.rydLoopPunkter() });
    K.registrer('tidslinje.foelg', { titel: 'kmd.foelg', genvej: 'F', koer: () => State.saet('tidslinje.foelg', !State.hent('tidslinje.foelg')) });
    K.registrer('tidslinje.zoomInd', { titel: 'kmd.zoomInd', genvej: '+', kan: har, koer: () => RS.Tidslinje.zoom(1.6) });
    K.registrer('tidslinje.zoomUd', { titel: 'kmd.zoomUd', genvej: '-', kan: har, koer: () => RS.Tidslinje.zoom(1 / 1.6) });
    K.registrer('tidslinje.visAlt', { titel: 'kmd.visAlt', genvej: '0', kan: har, koer: () => RS.Tidslinje.visAlt() });
    K.registrer('tempo.tap', { titel: 'kmd.tap', genvej: 'T', kan: har, koer: () => RS.Analyse.tap() });
    K.registrer('tempo.takt1', { titel: 'kmd.takt1', kan: har, koer: () => State.saet('sang.gitter.start', Math.round(A.position() * 1000) / 1000) });
    K.registrer('tempo.ryd', { titel: 'kmd.tempoRyd', kan: har, koer: () => RS.Analyse.saetTempo(null) });
    K.registrer('fil.aabn', { titel: 'kmd.aabn', genvej: 'O', koer: () => el.filValg.click() });
    K.registrer('fil.demo', { titel: 'kmd.demo', koer: aabnDemo });
    K.registrer('indstillinger.nulstil', { titel: 'kmd.nulstil', koer: () => { State.nulstil(); status('info', 'status.nulstillet'); } });
  }

  /* ---------- Start: find elementerne og sæt lyttere på ---------- */
  function start() {
    for (const id of ['status', 'statusPrik', 'statusTekst', 'log', 'logListe', 'sprogValg', 'stilValg', 'version', 'filValg', 'filInfo',
      'infoLaengde', 'infoKanaler', 'infoRate', 'infoStoerrelse', 'sangBoks', 'sangListe', 'previewTom', 'previewNote', 'fps',
      'tlUdsnit', 'snapHint', 'snapValg', 'foelgKnap', 'zoom', 'maalerFyld', 'maalerTop', 'rmsTal', 'peakTal', 'loopValg',
      'loopATal', 'loopBTal', 'loopRydKnap', 'bpmFelt', 'slagFelt', 'tempoRydKnap', 'tempoInfo', 'genvejListe', 'plTitel',
      'plMeta', 'spilIkon', 'loopKnap', 'tidNu', 'soeg', 'tidIalt', 'muteKnap', 'muteIkon', 'volumen', 'volTal']) el[id] = $(id);
    saetTekst(el.version, RS.version);
    registrerKommandoer();

    /* Knapper, der kører en kommando */
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-kommando]');
      if (b && !b.disabled) Kommandoer.koer(b.dataset.kommando);
    });
    /* Et museklik på en knap flytter ikke tastatur-fokus. Så virker Mellemrum stadig som afspil og pause bagefter. */
    document.addEventListener('mousedown', e => {
      if (!e.target.closest('button')) return;
      e.preventDefault();
      const a = document.activeElement;
      if (a && /^(INPUT|SELECT)$/.test(a.tagName)) a.blur();
    });
    /* Genveje */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { visLog(false); return; }
      const m = e.target, tag = m.tagName;
      if (m.isContentEditable || tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && m.type !== 'range')) return;
      const navn = Kommandoer.tastNavn(e);
      if (tag === 'INPUT' && /Arrow|Home|End/.test(navn)) return;                 // en skyder beholder piletasterne
      if ((tag === 'BUTTON' || tag === 'SUMMARY') && (navn === 'Space' || navn === 'Enter')) return;
      const k = Kommandoer.findGenvej(navn);
      if (k) { e.preventDefault(); Kommandoer.koer(k.id); }
    });

    /* Status og beskedliste */
    el.status.addEventListener('click', () => visLog(el.log.hidden));
    document.addEventListener('pointerdown', e => { if (!el.log.hidden && !e.target.closest('#log, #status')) visLog(false); });
    Events.on('status', s => status(s.type, s.noegle, s.vars));
    Events.on('fejl', e => status('fejl', 'status.uventet', { besked: (e && e.message) || String(e) }));

    /* Stil */
    el.stilValg.addEventListener('click', e => { const b = e.target.closest('[data-stil]'); if (b) State.saet('stil', b.dataset.stil); });
    State.lyt('stil', v => RS.Stil.saet(v));
    Events.on('stil:skiftet', tegnStil);

    /* Sprog */
    el.sprogValg.addEventListener('click', e => { const b = e.target.closest('[data-sprog]'); if (b) State.saet('sprog', b.dataset.sprog); });
    State.lyt('sprog', s => I18n.saetSprog(s));
    Events.on('i18n:sprog', tegnAlt);

    /* Filer: vælg, eller slip i vinduet */
    el.filValg.addEventListener('change', () => { const f = [...el.filValg.files]; el.filValg.value = ''; if (f.length) aabnFiler(f); });
    const harFiler = e => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    let traekTaeller = 0;
    window.addEventListener('dragenter', e => { if (!harFiler(e)) return; e.preventDefault(); traekTaeller++; document.body.classList.add('slipper'); });
    window.addEventListener('dragover', e => { if (harFiler(e)) e.preventDefault(); });
    window.addEventListener('dragleave', e => { if (!harFiler(e)) return; traekTaeller = Math.max(0, traekTaeller - 1); if (!traekTaeller) document.body.classList.remove('slipper'); });
    window.addEventListener('drop', e => {
      e.preventDefault();
      traekTaeller = 0;
      document.body.classList.remove('slipper');
      const f = e.dataTransfer ? [...e.dataTransfer.files] : [];
      if (f.length) aabnFiler(f);
    });

    /* Sang og afspiller */
    Events.on('audio:indlaest', () => { tapMangler = 0; tegnSang(); tegnLoop(); tegnTempo(); tegnSangliste(); });
    Events.on('audio:tilstand', tegnAfspiller);
    Events.on('analyse:fremskridt', f => status('arbejder', 'status.boelgeform', { pct: Math.round(f.p * 100) }));
    Events.on('analyse:boelgeform', () => {
      const m = RS.Audio.meta(), s = State.hent('sang');
      const noget = s.gitter.bpm || s.loop.a != null || s.loop.b != null || s.loop.tilstand !== 'fra';
      status('ok', m.husket && noget ? 'status.sangKlarHusket' : 'status.sangKlar', { navn: m.navn, tid: util.tidTekst(m.varighed) });
    });
    Events.on('analyse:tap', e => { tapMangler = e.mangler; tegnTempo(); });

    /* Søgning i playerbaren */
    const soegTid = () => (el.soeg.value / 1000) * RS.Audio.varighed();
    el.soeg.addEventListener('pointerdown', () => { soegTraekker = true; });
    window.addEventListener('pointerup', () => { soegTraekker = false; });
    window.addEventListener('pointercancel', () => { soegTraekker = false; });
    el.soeg.addEventListener('input', () => {
      fyldSkyder(el.soeg);
      const nu = performance.now();
      if (RS.Audio.tilstand() !== 'spiller' || nu - sidsteSoeg > 50) { RS.Audio.soeg(soegTid()); sidsteSoeg = nu; }
    });
    el.soeg.addEventListener('change', () => { RS.Audio.soeg(soegTid()); soegTraekker = false; });

    /* Lydstyrke */
    el.volumen.addEventListener('input', () => {
      fyldSkyder(el.volumen);
      State.saet('lyd.volumen', el.volumen.value / 100);
      if (State.hent('lyd.mute')) State.saet('lyd.mute', false);             // at skrue på lydstyrken slår lyden til igen
    });
    State.lyt('lyd', tegnLyd);

    /* Loop */
    el.loopValg.addEventListener('click', e => { const b = e.target.closest('[data-loop]'); if (b && !b.disabled) State.saet('sang.loop.tilstand', b.dataset.loop); });
    State.lyt('sang.loop', tegnLoop);

    /* Tempo-gitter */
    el.bpmFelt.addEventListener('change', () => { const v = parseFloat(el.bpmFelt.value); RS.Analyse.saetTempo(isFinite(v) ? v : null, 'manuel'); tegnTempo(); });
    el.bpmFelt.addEventListener('keydown', e => { if (e.key === 'Enter') el.bpmFelt.blur(); });
    el.slagFelt.addEventListener('change', () => { State.saet('sang.gitter.slagPrTakt', parseInt(el.slagFelt.value, 10)); el.slagFelt.blur(); });
    State.lyt('sang.gitter', tegnTempo);

    /* Tidslinjens knapper */
    el.snapValg.addEventListener('click', e => { const b = e.target.closest('[data-snap]'); if (b) State.saet('tidslinje.snap', b.dataset.snap); });
    State.lyt('tidslinje', tegnTidslinjeValg);
    el.zoom.addEventListener('input', () => { fyldSkyder(el.zoom); RS.Tidslinje.saetZoom01(el.zoom.value / 1000); });
    Events.on('tidslinje:visning', () => { if (document.activeElement !== el.zoom) saetSkyder(el.zoom, Math.round(RS.Tidslinje.zoom01() * 1000)); });
    /* Efter et træk med musen slipper skyderne fokus, så genvejene virker igen. */
    for (const s of [el.soeg, el.volumen, el.zoom]) s.addEventListener('pointerup', () => s.blur());

    RS.Rendering.tilfoej('ui', tik);
    tegnAlt();
    status('klar', 'status.klar');
  }

  return { start, status };
})();
/* ========== SLUT: UI ========== */
</script>

<script data-modul="start">
/* ========== START: sæt modulerne i gang i den rigtige rækkefølge ========== */
'use strict';
(() => {
  const { Events, State, I18n } = RS;
  /* Ingen fejl må forsvinde i stilhed: alt, der går galt, ender som en rød besked i topbaren. */
  window.addEventListener('error', e => Events.emit('fejl', e.error || new Error(e.message)));
  window.addEventListener('unhandledrejection', e => Events.emit('fejl', e.reason instanceof Error ? e.reason : new Error(String(e.reason))));

  I18n.saetSprog(State.hent('sprog'));
  RS.Stil.saet(State.hent('stil'));
  RS.UI.start();
  RS.Rendering.startPreview(document.getElementById('previewLaerred'));
  RS.Tidslinje.start({ laerred: document.getElementById('tlLaerred'), oversigt: document.getElementById('tlOversigt') });
  RS.Rendering.start();
})();
/* ========== SLUT: START ========== */
</script>
</body>
