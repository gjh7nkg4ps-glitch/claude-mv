<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rytme Studio 0.2 (Run 1: afspiller, tidslinje og tre stile)</title>
<!--
  RYTME STUDIO · én fil, der åbnes direkte i browseren (ingen server, intet internet).

  INDHOLD (hvert script-element med data-modul er ét modul og kan senere flyttes til sin egen fil):
    kerne        RS (det eneste globale navn), RS.util, RS.Events (beskeder mellem modulerne)
    i18n         RS.I18n          tekster på dansk og engelsk
    state        RS.State         indstillinger, gemt i localStorage; husker loop og tempo pr. sang
    stil         RS.Stil          de tre stile (Glas, Neon, Analog): farver og former til lærrederne
    kommandoer   RS.Kommandoer    alt, brugeren kan gøre (knapper, genveje; senere Ctrl+K)
    audio        RS.Audio         Web Audio: indlæs, afspil, pause, stop, søg, loop, lydstyrke
    analyse      RS.Analyse       Run 1: bølgeform, niveau (RMS), tempo-gitter og snap. Run 2: resten
    rendering    RS.Rendering     billed-løkken (requestAnimationFrame med delta-tid) og Live preview
    tidslinje    RS.Tidslinje     bølgeform-tidslinjen: zoom, snap, følg afspilning, loop A til B
    ui           RS.UI            topbar, sidebar, kontrolpanel, playerbar, status, slip en fil
    start        starter modulerne i den rigtige rækkefølge
  Kommer senere: RS.Mapping (Run 3), RS.Scene (Run 3 og 4).

  REGLER FOR KODEN:
    Modulerne taler sammen med beskeder (RS.Events) og gennem RS.State. Værdier, der ændrer sig hele
    tiden (position, niveau), læses i billed-løkken i stedet for at blive sendt som beskeder.
    Farverne har fast betydning: turkis = målt lyd, rav = tid (afspilningsstreg, loop, snap).
-->
<style>
/* ========== STIL: variabler ========== */
:root {
  /* Flader: roligt, mørkt blågråt */
  --grund: #141a22;
  --flade: #1a222c;
  --flade-2: #222c39;
  --flade-3: #2c3848;
  --dyb: #10161d;
  --tekst: #dde5ee;
  --tekst-2: #98a6b7;
  --tekst-3: #66748a;
  /* Signalfarver: lys kun på det, der måler noget */
  --lyd: #4fe0c8;
  --lyd-lys: #b6f7ea;
  --tid: #ffb85c;
  --fejl: #ff7a7a;
  --fokus: #cfe3ff;
  /* Mål */
  --luft: 14px;
  --r-stor: 16px;
  --r: 9px;
  --side-b: clamp(232px, 15vw, 312px);
  --panel-b: clamp(296px, 19vw, 400px);
  --skrift: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --skrift-tal: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
}

/* ========== STIL: grund ========== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.45 var(--skrift);
  color: var(--tekst);
  background:
    radial-gradient(1400px 620px at 68% -12%, #1d2937 0%, rgba(29, 41, 55, 0) 62%),
    var(--grund);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, p, dl, dd, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; }
.tal { font-family: var(--skrift-tal); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.ikon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ikon-fyldt { fill: currentColor; stroke: none; }

/* ========== STIL: layout (sidebar, preview, kontrolpanel, playerbar) ========== */
.app {
  display: grid;
  height: 100dvh;
  padding: var(--luft);
  gap: var(--luft);
  grid-template-columns: var(--side-b) minmax(0, 1fr) var(--panel-b);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "top    top    top"
    "side   midte  panel"
    "player player player";
}
.flade {
  background: var(--flade);
  border-radius: var(--r-stor);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
}

/* ========== STIL: topbar ========== */
.top { grid-area: top; display: flex; align-items: center; gap: 22px; padding: 2px 6px 0; position: relative; min-height: 38px; }
.brand { display: flex; align-items: center; gap: 10px; width: calc(var(--side-b) - 6px); flex: none; }
.brand-maerke { width: 26px; height: 26px; flex: none; }
.brand-navn { font: 600 19px/1 var(--skrift-tal); letter-spacing: .02em; }
.brand-version { font-size: 12px; color: var(--tekst-3); padding-top: 3px; }
.status {
  display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto;
  background: none; border: 0; padding: 7px 10px; margin-left: -10px; border-radius: var(--r); text-align: left; color: var(--tekst-2);
}
.status:hover { background: rgba(255, 255, 255, .04); color: var(--tekst); }
.status-prik { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--tekst-3); }
.status-prik[data-type="ok"] { background: var(--tekst); }
.status-prik[data-type="arbejder"] { background: var(--tid); animation: puls 1s ease-in-out infinite; }
.status-prik[data-type="fejl"] { background: var(--fejl); }
.status[data-type="fejl"] { color: var(--fejl); }
#statusTekst { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes puls { 50% { opacity: .35; } }
.top-hoejre { display: flex; align-items: center; gap: 10px; flex: none; }
.log {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: calc(var(--side-b) + var(--luft) - 4px);
  width: min(560px, calc(100vw - 2 * var(--luft))); max-height: 52vh; overflow: auto;
  background: var(--flade-2); border-radius: 12px; padding: 14px 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
}
.log h2 { margin-bottom: 8px; }
.log li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 5px 0; color: var(--tekst-2); }
.log li[data-type="fejl"] { color: var(--fejl); }
.log li:last-child { color: var(--tekst); }
.log time { color: var(--tekst-3); }

/* ========== STIL: knapper, skydere, valg ========== */
.knap {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--flade-2); border: 0; border-radius: var(--r); padding: 9px 14px; line-height: 1.2;
}
.knap:hover:not(:disabled) { background: var(--flade-3); }
.knap:disabled { opacity: .42; }
.knap-fyldt { background: var(--tekst); color: #131a22; font-weight: 600; }
.knap-fyldt:hover:not(:disabled) { background: #fff; }
.knap-lille { padding: 7px 11px; font-size: 13px; }
.knap[aria-pressed="true"] { background: rgba(255, 184, 92, .13); color: var(--tid); }
.top-hoejre .tl-etiket { margin-right: -2px; }
.knap-tekst { background: none; padding: 6px 2px; color: var(--tekst-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--tekst-3); }
.knap-tekst:hover:not(:disabled) { background: none; color: var(--tekst); }
.rund {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none;
  background: var(--flade-2); color: var(--tekst);
}
.rund:hover:not(:disabled) { background: var(--flade-3); }
.rund:disabled { opacity: .42; }
.rund[aria-pressed="true"] { background: rgba(255, 184, 92, .15); color: var(--tid); }
.rund-stor { width: 52px; height: 52px; background: var(--tekst); color: #131a22; }
.rund-stor:hover:not(:disabled) { background: #fff; }
.rund-stor .ikon { width: 22px; height: 22px; }
.rund-lille { width: 30px; height: 30px; font-size: 17px; line-height: 1; }
.seg { display: inline-flex; background: var(--flade-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 5px 11px; font-size: 13px; color: var(--tekst-2); white-space: nowrap; }
.seg button:hover:not(:disabled) { color: var(--tekst); }
.seg button[aria-pressed="true"] { background: var(--flade-3); color: var(--tekst); }
.seg button:disabled { opacity: .42; }
.seg-bred { display: flex; }
.seg-bred button { flex: 1; }

.skyder { -webkit-appearance: none; appearance: none; background: transparent; height: 20px; margin: 0; cursor: pointer; --p: 0%; --fyld: var(--tekst-2); min-width: 0; }
.skyder:disabled { opacity: .42; cursor: default; }
.skyder::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fyld) var(--p), var(--flade-3) var(--p)); }
.skyder::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--tekst); border: 0; }
.skyder::-moz-range-track { height: 4px; border-radius: 2px; background: var(--flade-3); }
.skyder::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fyld); }
.skyder::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--tekst); border: 0; }
.skyder-tid { --fyld: var(--tid); }
.felt { background: var(--dyb); border: 1px solid var(--flade-3); border-radius: var(--r); padding: 7px 9px; min-width: 0; }
.felt:hover:not(:disabled) { border-color: var(--tekst-3); }
.felt:disabled { opacity: .42; }
.hjaelp { color: var(--tekst-2); font-size: 13px; line-height: 1.5; }

/* ========== STIL: sidebar (navigation og lydfil) ========== */
.side { grid-area: side; display: flex; flex-direction: column; gap: 26px; padding: 14px; min-height: 0; overflow: auto; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-punkt {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r);
  background: none; color: var(--tekst-2); text-align: left; font-size: 15px;
}
.nav-punkt:hover:not(:disabled) { background: rgba(255, 255, 255, .04); color: var(--tekst); }
.nav-punkt[aria-current="page"] { background: var(--flade-2); color: var(--tekst); }
.nav-punkt:disabled { color: var(--tekst-3); }
.nav-senere { margin-left: auto; font-size: 12px; color: var(--tekst-3); }
.fil { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.side h2, .panel h2, .tl h2, .log h2 { font-size: 13px; font-weight: 600; color: var(--tekst-2); }
.info { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; padding: 4px 2px 0; }
.info dt { color: var(--tekst-3); }
.info dd { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sangliste { display: flex; flex-direction: column; gap: 2px; margin: 6px -4px 0; max-height: 22vh; overflow: auto; }
.sangliste button {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border: 0; border-radius: 7px; background: none;
  color: var(--tekst-2); text-align: left; font-size: 13px;
}
.sangliste button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sangliste button:hover { background: rgba(255, 255, 255, .04); color: var(--tekst); }
.sangliste button[aria-current="true"] { color: var(--tekst); background: var(--flade-2); }
.sangliste .ikon { width: 15px; height: 15px; }

/* ========== STIL: midten (Live preview og tidslinje) ========== */
.midte { grid-area: midte; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--luft); min-width: 0; min-height: 0; }
.preview {
  position: relative; overflow: hidden; border-radius: var(--r-stor); min-height: 0;
  background: radial-gradient(ellipse at 50% 42%, #1e2a38 0%, #161d27 58%, #10151c 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), inset 0 0 120px rgba(0, 0, 0, .25);
}
.preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.preview-tom { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 32px; text-align: center; }
.preview-tom h1 { font: 600 clamp(26px, 2.6vw, 44px)/1.1 var(--skrift-tal); letter-spacing: .01em; }
.preview-tom p { max-width: 54ch; color: var(--tekst-2); font-size: 15px; }
.preview-tom .raekke { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.preview-note { position: absolute; left: 18px; bottom: 14px; color: var(--tekst-3); font-size: 13px; }
.preview-fps { position: absolute; right: 18px; bottom: 14px; color: var(--tekst-3); font-size: 12px; }

.tl { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tl-top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-height: 32px; }
.tl-udsnit { color: var(--tekst-3); font-size: 13px; }
.tl-luft { flex: 1 1 0; }
.tl-etiket { color: var(--tekst-2); font-size: 13px; margin-right: -6px; }
.tl-hint { color: var(--tekst-3); font-size: 13px; }
.tl-zoom { display: flex; align-items: center; gap: 8px; }
.tl-zoom .skyder { width: clamp(90px, 9vw, 220px); }
.tl-oversigt, .tl-laerred { display: block; width: 100%; border-radius: 10px; background: var(--dyb); touch-action: none; }
.tl-oversigt { height: 44px; cursor: grab; }
.tl-laerred { height: clamp(150px, 24vh, 420px); cursor: crosshair; }

/* ========== STIL: kontrolpanel ========== */
.panel { grid-area: panel; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 28px; min-height: 0; overflow: auto; }
.panel section { display: flex; flex-direction: column; gap: 10px; }
.maaler { position: relative; height: 14px; border-radius: 7px; background: var(--dyb); overflow: hidden; }
.maaler-fyld { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #2a8f86 0%, var(--lyd) 70%, #dcfff7 100%); }
.maaler-top { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--lyd-lys); opacity: .9; }
.maaler-skala { position: relative; height: 16px; font-size: 11px; color: var(--tekst-3); margin-top: -6px; }
.maaler-skala span { position: absolute; top: 2px; transform: translateX(-50%); }
.maaler-skala span:last-child { transform: translateX(-100%); }
.maaler-tal { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.maaler-tal .tal { display: block; font-size: 32px; line-height: 1.05; color: var(--lyd); }
.maaler-tal div:last-child .tal { color: var(--lyd-lys); }
.maaler-tal small { font-size: 12px; color: var(--tekst-2); }
.raekke-ab { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px; }
.raekke-ab b { font: 600 14px var(--skrift-tal); color: var(--tid); }
.raekke-ab .tal { font-size: 17px; }
.raekke-felt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.raekke-felt .gruppe { display: flex; align-items: center; gap: 8px; }
.raekke-felt input.felt { width: 84px; text-align: right; }
.raekke-knapper { display: flex; gap: 8px; flex-wrap: wrap; }
.genveje summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--tekst-2); border-radius: 6px; }
.genveje summary:hover { color: var(--tekst); }
.genveje dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 10px; font-size: 13px; }
.genveje dt { color: var(--tekst); white-space: nowrap; }
.genveje dd { color: var(--tekst-2); }
.panel-bund { margin-top: auto; }

/* ========== STIL: playerbar ========== */
.player { grid-area: player; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr) minmax(0, 1fr); align-items: center; gap: 24px; padding: 12px 22px; }
.pl-sang { min-width: 0; }
.pl-titel { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-meta { font-size: 13px; color: var(--tekst-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-midt { display: flex; align-items: center; gap: 22px; min-width: 0; }
.pl-knapper { display: flex; align-items: center; gap: 10px; flex: none; }
.pl-soeg { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; }
.pl-soeg .skyder { flex: 1 1 auto; }
.pl-soeg .tal { font-size: 20px; min-width: 4.6ch; }
.pl-soeg .tal:last-child { color: var(--tekst-2); text-align: right; min-width: 3.4ch; }
.pl-hoejre { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
.pl-hoejre .skyder { width: clamp(80px, 8vw, 170px); }
.pl-hoejre .tal { min-width: 4.2ch; text-align: right; color: var(--tekst-2); }
#muteKnap[aria-pressed="true"] { background: var(--flade-2); color: var(--tekst-3); }

/* ========== STIL: slip en fil ========== */
.slip {
  position: fixed; inset: var(--luft); z-index: 50; display: none; place-items: center; pointer-events: none;
  border: 2px dashed var(--tekst-2); border-radius: 22px; background: rgba(16, 22, 29, .86);
  font: 600 clamp(22px, 2.2vw, 36px) var(--skrift-tal);
}
body.slipper .slip { display: grid; }

/* ========== STIL: smalle skærme ========== */
@media (max-width: 1180px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-columns: var(--side-b) minmax(0, 1fr); grid-template-rows: auto auto auto auto;
    grid-template-areas: "top top" "side midte" "side panel" "player player"; }
  .preview { min-height: 320px; height: 46vh; }
  .player { position: sticky; bottom: var(--luft); box-shadow: 0 10px 40px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .035); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "side" "midte" "panel" "player"; }
  .brand { width: auto; }
  .top { flex-wrap: wrap; gap: 8px 14px; }
  .top-hoejre { flex-wrap: wrap; margin-left: auto; }
  .top-hoejre .tl-etiket { display: none; }
  .status { order: 3; flex-basis: 100%; margin-left: 0; }
  .log { left: 0; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav-punkt { width: auto; white-space: nowrap; }
  .nav-senere { margin-left: 4px; }
  .fil { margin-top: 0; }
  .player { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px 14px; }
  .pl-midt { flex-wrap: wrap; gap: 10px; }
  .pl-hoejre { justify-content: flex-start; }
  .tl-luft { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .status-prik[data-type="arbejder"] { animation: none; }
}

/* ========== STIL 1 · GLAS: roligt blågråt, glas og glød ========== */
html[data-stil="glas"] body {
  background:
    radial-gradient(900px 520px at 80% -8%, rgba(79, 224, 200, .11), transparent 62%),
    radial-gradient(1100px 700px at 6% 108%, rgba(92, 132, 255, .12), transparent 60%),
    radial-gradient(1400px 620px at 60% -12%, #1d2937, transparent 62%), #121820;
}
html[data-stil="glas"] .flade {
  background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .022));
  border: 1px solid rgba(255, 255, 255, .08);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .08);
}
html[data-stil="glas"] .preview { border: 1px solid rgba(255, 255, 255, .07); }
html[data-stil="glas"] .nav-punkt[aria-current="page"] { background: linear-gradient(90deg, rgba(79, 224, 200, .15), rgba(255, 255, 255, .04)); box-shadow: inset 2px 0 0 var(--lyd); }
html[data-stil="glas"] .knap, html[data-stil="glas"] .rund, html[data-stil="glas"] .seg { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
html[data-stil="glas"] .knap-fyldt, html[data-stil="glas"] .rund-stor { background: linear-gradient(180deg, #f4f8fc, #c9d6e4); }
html[data-stil="glas"] .rund-stor { box-shadow: 0 0 0 6px rgba(255, 255, 255, .06), 0 10px 26px rgba(0, 0, 0, .45); }
html[data-stil="glas"] .maaler-fyld { box-shadow: 0 0 14px rgba(79, 224, 200, .55); }
html[data-stil="glas"] .maaler-tal .tal { text-shadow: 0 0 22px rgba(79, 224, 200, .4); }
html[data-stil="glas"] .tl-oversigt, html[data-stil="glas"] .tl-laerred { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05), inset 0 12px 30px rgba(0, 0, 0, .35); }
html[data-stil="glas"] .skyder-tid::-webkit-slider-thumb { box-shadow: 0 0 12px rgba(255, 184, 92, .7); }

/* ========== STIL 2 · NEON: dyb violet, lysende farveforløb, runde former ========== */
html[data-stil="neon"] {
  --grund: #0c0a1a; --flade: #141128; --flade-2: #1e1a3a; --flade-3: #2c2654; --dyb: #090714;
  --tekst: #f1eeff; --tekst-2: #a79fd0; --tekst-3: #6c648f;
  --lyd: #2de2ff; --lyd-lys: #ff5fa8; --tid: #ffe066; --fejl: #ff7b8e; --fokus: #ffe066;
  --luft: 16px; --r-stor: 26px; --r: 999px;
  --skrift: "Avenir Next", "Century Gothic", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

html[data-stil="analog"] .maaler-fyld { inset: 4px; transform: none !important; background: linear-gradient(90deg, #8fe055 0 62%, #ffd166 62% 82%, #ff5d3a 82%); clip-path: inset(0 calc(100% - var(--niv, 0) * 100%) 0 0); -webkit-mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); filter: drop-shadow(0 0 5px rgba(240, 195, 90, .6)); }

html[data-stil="analog"] .tl-oversigt, html[data-stil="analog"] .tl-laerred { border-radius: 4px; background: #0e0b08; box-shadow: inset 0 2px 8px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 240, 210, .08); }

<script data-modul="kerne">
/* ========== KERNE: RS, RS.util, RS.Events ==========
   RS er det eneste globale navn. Alle moduler hænger på RS. */
'use strict';
window.RS = { version: '0.2', run: 1 };

RS.util = {
  klem: (v, a, b) => (v < a ? a : v > b ? b : v),
  /* Sekunder som tekst: 83.46 → "1:23.4" (dec = antal decimaler). Kommaet følger sproget. */
  tidTekst(s, dec = 0) {
    if (!isFinite(s) || s < 0) s = 0;
    const f = Math.pow(10, dec);
    s = Math.floor(s * f + 1e-6) / f;
    const m = Math.floor(s / 60), r = s - m * 60;
    const tekst = m + ':' + (r < 10 ? '0' : '') + r.toFixed(dec);
    return RS.I18n && RS.I18n.komma() === ',' ? tekst.replace('.', ',') : tekst;
  },
  /* Lineær styrke (0 til 1) til decibel (fagudtryk: dBFS, hvor 0 er det højeste, filen kan rumme). */
  dB: lin => (lin > 1e-7 ? 20 * Math.log10(lin) : -Infinity),
  /* Et tal med sprogets komma: 3.14 → "3,14" på dansk. */
  talTekst(v, dec = 1) {
    const t = v.toFixed(dec).replace('-', '−');
    return RS.I18n && RS.I18n.komma() === ',' ? t.replace('.', ',') : t;
  },
  stoerrelseTekst(bytes) {
    if (!bytes) return '–';
    return bytes < 1048576 ? RS.util.talTekst(bytes / 1024, 0) + ' KB' : RS.util.talTekst(bytes / 1048576, 1) + ' MB';
  }
};

/* Beskeder mellem modulerne (fagudtryk: event bus eller publish/subscribe).
   En lytter, der fejler, stopper ikke de andre; fejlen sendes videre som beskeden 'fejl'. */
RS.Events = (() => {
  const lyttere = new Map();
  function on(navn, fn) {
    if (!lyttere.has(navn)) lyttere.set(navn, new Set());
    lyttere.get(navn).add(fn);
    return () => off(navn, fn);
  }
  function off(navn, fn) { const s = lyttere.get(navn); if (s) s.delete(fn); }
  function emit(navn, data) {
    const s = lyttere.get(navn);
    if (!s) return;
    for (const fn of [...s]) {
      try { fn(data); }
      catch (e) { console.error('[RS.Events] ' + navn, e); if (navn !== 'fejl') emit('fejl', e); }
    }
  }
  return { on, off, emit };
})();
/* ========== SLUT: KERNE ========== */
</script>

      'status.nulstillet': 'Volume, follow and snap are back to defaults.',
      'status.foelgFra': 'Follow playback was turned off because you moved the view yourself.'
    }
  };
  let sprog = 'da';

  function t(noegle, vars) {
    let s = tekster[sprog][noegle];
    if (s === undefined) s = tekster.da[noegle];
    if (s === undefined) return noegle;
    return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m)) : s;
  }
  /* Sæt alle tekster i siden (eller i en del af den). */
  function anvend(rod = document) {
    rod.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
    rod.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = t(e.dataset.i18nTitle); });
    rod.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
  }
  function saetSprog(nyt) {
    sprog = tekster[nyt] ? nyt : 'da';
    document.documentElement.lang = sprog;
    anvend();
    RS.Events.emit('i18n:sprog', sprog);
  }
  return { t, anvend, saetSprog, sprog: () => sprog, komma: () => (sprog === 'da' ? ',' : '.'), sprogListe: () => Object.keys(tekster) };
})();
/* ========== SLUT: I18N ========== */
</script>

<script data-modul="state">
/* ========== STATE: indstillinger, gemt i localStorage ==========
   Ét sted, hvor alt det, der skal huskes, bor. En ændring sender beskeden 'state:aendret' {sti, vaerdi}.
   "sang" er indstillingerne for den sang, der er åben (loop og tempo-gitter); de gemmes pr. sang
   (navn + længde) i "sange", så de er der igen, næste gang samme fil åbnes. */
'use strict';
RS.State = (() => {
  const { Events } = RS;
  const NOEGLE = 'rytme-studio:v1', MAKS_SANGE = 60;
  const STANDARD = {
    version: 1,
    sprog: 'da',
    stil: 'glas',                                  // 'glas' | 'neon' | 'analog'
    lyd: { volumen: 0.8, mute: false },
    tidslinje: { foelg: true, snap: 'fra' },      // snap: 'fra' | 'slag' | 'takt'
    sange: {}
  };
  const SANG_STANDARD = {
    gitter: { bpm: null, start: 0, slagPrTakt: 4, kilde: null },   // kilde: 'manuel' | 'tap' | 'demo'
    loop: { tilstand: 'fra', a: null, b: null }                    // tilstand: 'fra' | 'sang' | 'ab'
  };

  const klon = o => JSON.parse(JSON.stringify(o));
  function flet(maal, kilde) {
    for (const k in kilde) {
      const v = kilde[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && maal[k] && typeof maal[k] === 'object') flet(maal[k], v);
      else maal[k] = v;
    }
    return maal;
  }
  function laes() {
    try { const r = localStorage.getItem(NOEGLE); return r ? JSON.parse(r) : {}; }
    catch (e) { return {}; }
  }

  const data = flet(klon(STANDARD), laes());
  data.sang = klon(SANG_STANDARD);
  let sangNoegle = null, gemTimer = 0, lagerFejlMeldt = false;

  function gem() {
    gemTimer = 0;
    try {
      const ud = klon(data);
      delete ud.sang;
      localStorage.setItem(NOEGLE, JSON.stringify(ud));
    } catch (e) {
      if (!lagerFejlMeldt) { lagerFejlMeldt = true; Events.emit('status', { type: 'fejl', noegle: 'status.lagerfejl' }); }
    }
  }
  function planlaegGem() { if (!gemTimer) gemTimer = setTimeout(gem, 300); }
  function gemNu() { if (gemTimer) { clearTimeout(gemTimer); gem(); } }
  window.addEventListener('pagehide', gemNu);

  function hent(sti) {
    let o = data;
    for (const d of sti.split('.')) { if (o == null) return undefined; o = o[d]; }
    return o;
  }
  function huskSang() {
    if (!sangNoegle) return;
    data.sange[sangNoegle] = Object.assign(klon(data.sang), { brugt: Date.now() });
  }
  /* Sæt en værdi, fx saet('lyd.volumen', 0.5). Giver true, hvis noget ændrede sig. */
  function saet(sti, vaerdi) {
    const dele = sti.split('.'), sidste = dele.pop();
    let o = data;
    for (const d of dele) { if (o[d] == null || typeof o[d] !== 'object') o[d] = {}; o = o[d]; }
    if (JSON.stringify(o[sidste]) === JSON.stringify(vaerdi)) return false;
    o[sidste] = vaerdi;
    if (sti === 'sang' || sti.startsWith('sang.')) huskSang();
    planlaegGem();
    Events.emit('state:aendret', { sti, vaerdi });
    return true;
  }
  /* Lyt på en gren, fx lyt('sang.loop', fn). fn får grenens nye værdi. */
  function lyt(gren, fn) {
    return Events.on('state:aendret', e => {
      if (e.sti === gren || e.sti.startsWith(gren + '.') || gren.startsWith(e.sti + '.')) fn(hent(gren), e);
    });
  }
  /* En ny sang er åbnet: hent dens gemte loop og tempo, eller brug forslaget. Giver true, hvis sangen var husket. */
  function skiftSang(noegle, forslag) {
    sangNoegle = noegle;
    const gemt = noegle ? data.sange[noegle] : null;
    data.sang = flet(klon(SANG_STANDARD), gemt ? klon(gemt) : (forslag || {}));
    delete data.sang.brugt;
    if (noegle) {
      huskSang();
      const noegler = Object.keys(data.sange);
      if (noegler.length > MAKS_SANGE) {
        noegler.sort((a, b) => (data.sange[a].brugt || 0) - (data.sange[b].brugt || 0));
        for (const n of noegler.slice(0, noegler.length - MAKS_SANGE)) delete data.sange[n];
      }
    }
    planlaegGem();
    Events.emit('state:aendret', { sti: 'sang', vaerdi: data.sang });
    return !!gemt;
  }
  /* Grundlag for presets (Run 4): et øjebliksbillede af indstillingerne, og det modsatte. */
  function snapshot() { const s = klon(data); delete s.sange; return s; }
  function gendan(s) { for (const k of ['sprog', 'stil', 'lyd', 'tidslinje']) if (s && s[k] !== undefined) saet(k, klon(s[k])); }
  function nulstil() { saet('lyd', klon(STANDARD.lyd)); saet('tidslinje', klon(STANDARD.tidslinje)); }

  return { hent, saet, lyt, skiftSang, snapshot, gendan, nulstil, gemNu };
})();
/* ========== SLUT: STATE ========== */
</script>
