<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rytme Studio · kladder</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #e8e6e1; font: 14px/1.4 "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 10px 16px; background: #141414; border-bottom: 1px solid #2a2a2a; }
  .gr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .gr > span { color: #9a968e; margin-right: 4px; }
  button { font: inherit; color: #cfcbc3; background: #222; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #2c2c2c; }
  button[aria-pressed="true"] { background: #e8e6e1; color: #111; border-color: #e8e6e1; }
  button.farve { width: 28px; height: 28px; padding: 0; border-radius: 50%; }
  button.farve[aria-pressed="true"] { outline: 2px solid #e8e6e1; outline-offset: 2px; border-color: #111; }
  #scene { padding: 14px; }
  #scene svg { display: block; width: 100%; height: auto; max-width: 1920px; margin: 0 auto; box-shadow: 0 10px 50px rgba(0,0,0,.6); }
  #tekst { max-width: 1100px; margin: 4px auto 30px; padding: 0 16px; color: #b9b5ad; font-size: 15px; }
  #tekst b { color: #e8e6e1; }
</style></head><body>
<div class="bar">
  <div class="gr" id="vKladde"><span>Kladde</span></div>
  <div class="gr" id="vLys"><span>Lys</span><button data-m="moerk">Mørk</button><button data-m="lys">Lys</button></div>
  <div class="gr" id="vTone"><span>Grundtone</span></div>
  <div class="gr" id="vAcc"><span>Accent</span></div>
  <div class="gr"><button id="std">Kladdens egne farver</button></div>
</div>
<div id="scene"></div>
<p id="tekst"></p>
<script>
/* Ti kladder til Rytme Studio. Hver er én SVG-tegning på 1920 × 1080. Intet her er bygget ind i programmet.
   Alle farver kommer fra paletten P (lys eller mørk × grundtone × accent), så hver kladde kan ses i alle farver. */
'use strict';
const SERIF = 'Didot, "Bodoni MT", "Playfair Display", "Libre Baskerville", Georgia, "Times New Roman", serif';
const SANS = '"Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif';
const TONER = { neutral: ['Neutral', 40, 3], varm: ['Varm', 32, 16], kold: ['Kold', 215, 24], groen: ['Grøn', 160, 32], aubergine: ['Aubergine', 320, 24] };
const ACC = { elfenben: ['Elfenben', 40, 30, 88], guld: ['Guld', 40, 52, 60], kobber: ['Kobber', 22, 60, 66], roed: ['Rød', 8, 72, 55], blaa: ['Blå', 215, 92, 68], turkis: ['Turkis', 170, 66, 52], violet: ['Violet', 265, 80, 70] };
const hsl = (h, s, l, a) => a == null ? `hsl(${h} ${s}% ${l}%)` : `hsl(${h} ${s}% ${l}% / ${a})`;
function palet(m, tone, acc) {
  const [, h, s] = TONER[tone], [, ah, as, al] = ACC[acc], d = m === 'moerk';
  const akk = acc === 'elfenben' ? (d ? [h, 20, 90] : [h, 12, 12]) : [ah, as, d ? al : Math.min(al, 46)];
  return {
    d, bg: d ? hsl(h, s, 6.5) : hsl(h, s * 0.9, 95), bg2: d ? hsl(h, s, 4) : hsl(h, s * 0.9, 91), fl: d ? hsl(h, s * 0.9, 11) : hsl(h, s * 0.7, 98.5),
    k: d ? hsl(h, s * 0.8, 21) : hsl(h, s * 0.6, 80), ink: d ? hsl(h, s * 0.5 + 6, 92) : hsl(h, s * 0.6 + 4, 9), gr: d ? hsl(h, s * 0.4 + 3, 56) : hsl(h, s * 0.4 + 3, 44),
    acc: hsl(...akk), accA: a => hsl(akk[0], akk[1], akk[2], a), paa: akk[2] > 55 ? hsl(h, s, 7) : '#fff',
    sc: hsl(h, s + 4, 5.5), sc2: hsl(h, s + 6, 14), scInk: hsl(h, 14, 92), scGr: hsl(h, 8, 60),          /* scenen (billedet) er altid mørk */
    figLys: hsl(akk[0], 60, 96), figMidt: hsl(akk[0], Math.max(akk[1], 18), acc === 'elfenben' ? 72 : 62), figDyb: hsl(akk[0], Math.max(akk[1], 12) * 0.7, 18)
  };
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.s || 14}" fill="${o.f || '#fff'}" font-weight="${o.w || 400}" text-anchor="${o.a || 'start'}" font-family='${o.ff || SANS}' letter-spacing="${o.ls || 0}" opacity="${o.o == null ? 1 : o.o}" ${o.it ? 'font-style="italic"' : ''} ${o.rot ? `transform="rotate(${o.rot} ${x} ${y})"` : ''}>${esc(s)}</text>`;
const L = (x1, y1, x2, y2, st, w = 1, o = 1, x = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" stroke-width="${w}" opacity="${o}" ${x}/>`;
const R = (x, y, w, h, f, rx = 0, st = 'none', o = 1, sw = 1) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" rx="${rx}" stroke="${st}" stroke-width="${sw}" opacity="${o}"/>`;
const C = (cx, cy, r, f, st = 'none', sw = 1, o = 1) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${st}" stroke-width="${sw}" opacity="${o}"/>`;
let froe = 7; const rnd = () => { froe = (froe * 1664525 + 1013904223) >>> 0; return froe / 4294967296; };
function niv(t) { const p = (t % 0.5) / 0.5, del = t >= 16 && t < 24 ? 0.42 : t < 8 ? 0.72 : 1; return Math.min(1, (0.28 + 0.72 * Math.exp(-4.5 * p)) * del * (0.82 + 0.18 * rnd())); }
const tid = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const polar = (cx, cy, r, g) => { const a = (g - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const bue = (cx, cy, r, a0, a1) => { const p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1); return `M${p0[0]} ${p0[1]} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p1[0]} ${p1[1]}`; };
const POS = 7.6, A = 8, B = 12, OMR = ['Afspiller', 'Analyse', 'Figurer', 'Regler', 'Show'];
/* Fælles: farveforløb til figuren, og selve figuren (en kugle med glød og top-ring). */
const defs = P => `<defs><radialGradient id="fg" cx="40%" cy="34%"><stop offset="0" stop-color="${P.figLys}"/><stop offset=".5" stop-color="${P.figMidt}"/><stop offset="1" stop-color="${P.figDyb}"/></radialGradient>
  <radialGradient id="fgl"><stop offset="0" stop-color="${P.figMidt}" stop-opacity=".32"/><stop offset="1" stop-color="${P.figMidt}" stop-opacity="0"/></radialGradient>
  <radialGradient id="scn" cx="50%" cy="45%"><stop offset="0" stop-color="${P.sc2}"/><stop offset="1" stop-color="${P.sc}"/></radialGradient>
  <filter id="sk" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="${P.d ? .45 : .2}"/></filter>
  <filter id="gl" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
const fig = (cx, cy, r, P) => C(cx, cy, r * 2.3, 'url(#fgl)') + C(cx, cy, r, 'url(#fg)') + C(cx, cy, r * 1.25, 'none', P.scInk, 1, 0.3);
/* Bølgeform som lodrette streger. o: {x, yc, w, n, amp, t0, t1, f, fs (spillet farve), sw} */
function boelge(o) { let s = ''; for (let i = 0; i < o.n; i++) { const t = o.t0 + i / o.n * (o.t1 - o.t0), h = niv(t) * o.amp, x = o.x + i * (o.w / o.n); s += L(x, o.yc - h, x, o.yc + h, t < POS ? (o.fs || o.f) : o.f, o.sw || 1.5, t < POS ? 1 : 0.3); } return s; }
const maerke = (n, navn, P) => R(1920 - 270, 1080 - 40, 270, 40, P.bg2, 0, 'none', 0.9) + T(1900, 1080 - 15, 'Kladde ' + n + ' af 10 · ' + navn, { s: 13, f: P.gr, a: 'end', ls: 0.5 });

const K = [];
/* ============ 1 · GALLERI ============ */
K.push({ navn: 'Galleri', std: ['moerk', 'neutral', 'elfenben'], om: 'Billedet hænger som et værk i en ramme. Alt andet er tynde linjer, tal og tekst uden kasser.', tegn(P) {
  froe = 7; const s = [R(0, 0, 1920, 1080, P.bg), defs(P)];
  s.push(T(64, 66, 'Rytme Studio', { s: 24, f: P.ink, ff: SERIF, it: 1 }));
  OMR.forEach((n, i) => { const x = 1196 + i * 136; s.push(T(x, 64, n, { s: 14, f: i ? P.gr : P.ink, ls: 2.2 })); if (!i) s.push(L(x, 76, x + 86, 76, P.acc, 1.5)); });
  s.push(L(64, 96, 1856, 96, P.ink, 1, 0.14) + T(64, 150, 'Værker', { s: 12, f: P.gr, ls: 2.4 }));
  [['Demo-lyd, 120 BPM', '0:32', 1], ['Nordlys (mix 4).mp3', '4:12', 0], ['Trommer alene.wav', '1:48', 0]].forEach((v, i) => { const y = 196 + i * 62; s.push(T(64, y, 'Nr. ' + (i + 1), { s: 12, f: P.gr, ls: 1 }) + T(64, y + 24, v[0], { s: 16, f: v[2] ? P.ink : P.gr, ff: SERIF }) + T(300, y + 24, v[1], { s: 13, f: P.gr, a: 'end' }) + L(64, y + 40, 300, y + 40, P.ink, 1, 0.12)); });
  s.push(T(64, 420, 'Hent et værk', { s: 14, f: P.ink, ls: 1 }) + L(64, 430, 154, 430, P.acc, 1.5) + T(64, 458, 'eller slip en lydfil i vinduet', { s: 13, f: P.gr }));
  s.push(R(372, 138, 1176, 600, 'url(#scn)', 0, P.ink, 1) + fig(960, 438, 172, P));
  s.push(T(372, 792, 'Demo-lyd', { s: 40, f: P.ink, ff: SERIF }) + T(372, 822, '120 BPM  ·  stereo  ·  lavet i programmet', { s: 13, f: P.gr, ls: 1 }) + T(1548, 792, '0:07,6', { s: 54, f: P.ink, ff: SERIF, a: 'end' }) + T(1548, 822, 'af 0:32', { s: 13, f: P.gr, a: 'end', ls: 1 }));
  const x0 = 372, w = 1176, xa = x0 + A / 32 * w, xb = x0 + B / 32 * w, xp = x0 + POS / 32 * w;
  s.push(boelge({ x: x0, yc: 912, w, n: 392, amp: 42, t0: 0, t1: 32, f: P.ink, fs: P.ink, sw: 1 }));
  s.push(L(xa, 858, xb, 858, P.acc, 1.5) + L(xa, 858, xa, 866, P.acc) + L(xb, 858, xb, 866, P.acc) + T(xa, 850, 'A', { s: 12, f: P.acc, ff: SERIF, it: 1 }) + T(xb, 850, 'B', { s: 12, f: P.acc, a: 'end', ff: SERIF, it: 1 }) + L(xp, 850, xp, 974, P.acc, 1.5));
  for (let b = 0; b <= 16; b += 4) s.push(T(x0 + b / 16 * w, 992, b === 16 ? '0:32' : 'takt ' + (b + 1), { s: 11, f: P.gr, a: b === 16 ? 'end' : 'start', ls: 1 }));
  s.push(T(372, 1042, 'Stop', { s: 14, f: P.gr, ls: 2 }) + T(452, 1042, 'Pause', { s: 14, f: P.ink, ls: 2 }) + L(452, 1052, 506, 1052, P.acc, 1.5) + T(548, 1042, 'Loop A til B', { s: 14, f: P.ink, ls: 2 }) + T(1320, 1042, 'Lydstyrke', { s: 14, f: P.gr, ls: 2 }) + L(1420, 1037, 1548, 1037, P.ink, 1, 0.25) + L(1420, 1037, 1522, 1037, P.ink, 1) + C(1522, 1037, 4, P.ink));
  const hx = 1620;
  s.push(T(hx, 150, 'Niveau', { s: 12, f: P.gr, ls: 2.4 }) + T(hx, 214, '−9,6', { s: 60, f: P.ink, ff: SERIF }) + T(hx + 150, 214, 'dB RMS', { s: 13, f: P.gr, ls: 1 }) + L(hx, 240, 1856, 240, P.ink, 1, 0.2) + L(hx, 240, hx + 178, 240, P.acc, 2.5) + L(hx + 214, 232, hx + 214, 248, P.ink, 1) + T(1856, 266, 'top −2,4 dB', { s: 12, f: P.gr, a: 'end' }));
  s.push(T(hx, 340, 'Loop', { s: 12, f: P.gr, ls: 2.4 }) + T(hx, 384, 'A', { s: 15, f: P.gr, ff: SERIF, it: 1 }) + T(hx + 30, 384, '0:08,00', { s: 24, f: P.ink, ff: SERIF }) + T(hx, 420, 'B', { s: 15, f: P.gr, ff: SERIF, it: 1 }) + T(hx + 30, 420, '0:12,00', { s: 24, f: P.ink, ff: SERIF }) + L(hx, 446, 1856, 446, P.ink, 1, 0.14));
  s.push(T(hx, 510, 'Tempo', { s: 12, f: P.gr, ls: 2.4 }) + T(hx, 566, '120', { s: 48, f: P.ink, ff: SERIF }) + T(hx + 92, 566, 'BPM  ·  4 slag pr. takt', { s: 13, f: P.gr, ls: 1 }) + L(hx, 592, 1856, 592, P.ink, 1, 0.14) + T(hx, 622, 'Tap', { s: 14, f: P.ink, ls: 2 }) + T(hx + 60, 622, 'Takt 1 her', { s: 14, f: P.ink, ls: 2 }));
  s.push(T(hx, 706, 'Snap', { s: 12, f: P.gr, ls: 2.4 }) + T(hx, 738, 'Fra', { s: 14, f: P.gr, ls: 2 }) + T(hx + 52, 738, 'Slag', { s: 14, f: P.gr, ls: 2 }) + T(hx + 116, 738, 'Takt', { s: 14, f: P.ink, ls: 2 }) + L(hx + 116, 748, hx + 156, 748, P.acc, 1.5));
  return s.join('') + maerke(1, 'Galleri', P);
} });

/* ============ 2 · URVÆRK ============ */
K.push({ navn: 'Urværk', std: ['moerk', 'kold', 'kobber'], om: 'Tiden er en cirkel: hele sangen ligger som en ring om billedet, afspilningen er en viser, loop A til B er en bue. Målingerne er små urskiver.', tegn(P) {
  froe = 7; const cx = 960, cy = 528, s = [R(0, 0, 1920, 1080, P.bg), defs(P)];
  s.push(T(64, 66, 'RYTME STUDIO', { s: 15, f: P.ink, ls: 6, w: 500 }) + T(64, 90, 'Demo-lyd  ·  120 BPM', { s: 13, f: P.gr, ls: 1 }));
  OMR.forEach((n, i) => { s.push(T(64, 470 + i * 38, n, { s: 14, f: i ? P.gr : P.ink, ls: 2 })); if (!i) s.push(L(40, 465, 54, 465, P.acc, 1.5)); });
  const N = 360, r1 = 372;
  for (let i = 0; i < N; i++) { const t = i / N * 32, h = 8 + niv(t) * 56, p0 = polar(cx, cy, r1, i), p1 = polar(cx, cy, r1 + h, i); s.push(L(p0[0], p0[1], p1[0], p1[1], t < POS ? P.acc : P.ink, 2.2, t < POS ? 1 : 0.22)); }
  s.push(C(cx, cy, r1 - 8, 'none', P.ink, 1, 0.22));
  for (let b = 0; b < 16; b++) { const a = b / 16 * 360, p0 = polar(cx, cy, r1 - 8, a), p1 = polar(cx, cy, r1 - (b % 4 ? 18 : 26), a), pt = polar(cx, cy, r1 - 42, a); s.push(L(p0[0], p0[1], p1[0], p1[1], P.ink, b % 4 ? 1 : 1.6, 0.7)); if (b % 2 === 0) s.push(T(pt[0], pt[1] + 4, tid(b * 2), { s: 12, f: P.gr, a: 'middle', ls: 0.5 })); }
  s.push(`<path d="${bue(cx, cy, r1 + 78, A / 32 * 360, B / 32 * 360)}" fill="none" stroke="${P.acc}" stroke-width="3"/>`);
  [[A, 'A'], [B, 'B']].forEach(([t, n]) => { const p = polar(cx, cy, r1 + 100, t / 32 * 360); s.push(T(p[0], p[1] + 5, n, { s: 14, f: P.acc, a: 'middle', w: 600 })); });
  const r2 = 286;
  for (let i = 0; i < 240; i++) { const t = POS - 2 + i / 240 * 4, a = i * 1.5, h = 4 + niv(Math.max(0, t)) * 30, p0 = polar(cx, cy, r2 - h, a), p1 = polar(cx, cy, r2, a); s.push(L(p0[0], p0[1], p1[0], p1[1], i < 120 ? P.acc : P.ink, 1.6, i < 120 ? 0.75 : 0.18)); }
  s.push(C(cx, cy, 236, 'url(#scn)', P.ink, 1) + fig(cx, cy, 100, P));
  const pv0 = polar(cx, cy, 240, POS / 32 * 360), pv1 = polar(cx, cy, r1 + 70, POS / 32 * 360);
  s.push(L(pv0[0], pv0[1], pv1[0], pv1[1], P.acc, 2.5) + C(pv1[0], pv1[1], 5, P.acc));
  const skive = (x, y, navn, tal, enhed, andel) => {
    s.push(C(x, y, 92, P.fl, P.ink, 1) + `<path d="${bue(x, y, 76, 225, 495)}" fill="none" stroke="${P.ink}" stroke-width="2" opacity=".18"/><path d="${bue(x, y, 76, 225, 225 + 270 * andel)}" fill="none" stroke="${P.acc}" stroke-width="3" stroke-linecap="round"/>`);
    for (let i = 0; i <= 9; i++) { const p0 = polar(x, y, 84, 225 + i * 30), p1 = polar(x, y, 89, 225 + i * 30); s.push(L(p0[0], p0[1], p1[0], p1[1], P.ink, 1, 0.5)); }
    s.push(T(x, y + 10, tal, { s: 34, f: P.ink, a: 'middle', w: 300 }) + T(x, y + 34, enhed, { s: 11, f: P.gr, a: 'middle', ls: 1.5 }) + T(x, y - 112, navn, { s: 12, f: P.gr, a: 'middle', ls: 3 }));
  };
  skive(1560, 250, 'NIVEAU', '−9,6', 'dB RMS', 0.82); skive(1760, 470, 'TEMPO', '120', 'BPM · 4/4', 0.45); skive(1560, 800, 'LYDSTYRKE', '80', 'procent', 0.8);
  s.push(T(300, 232, 'LOOP', { s: 12, f: P.gr, ls: 3 }) + T(300, 272, 'A  0:08,00', { s: 20, f: P.ink, w: 300 }) + T(300, 302, 'B  0:12,00', { s: 20, f: P.ink, w: 300 }) + L(300, 320, 420, 320, P.acc, 1.5) + T(300, 344, 'tændt', { s: 12, f: P.acc, ls: 1.5 }));
  s.push(T(300, 800, 'SNAP', { s: 12, f: P.gr, ls: 3 }) + T(300, 832, 'Fra', { s: 14, f: P.gr, ls: 1 }) + T(344, 832, 'Slag', { s: 14, f: P.gr, ls: 1 }) + T(396, 832, 'Takt', { s: 14, f: P.ink, ls: 1 }) + L(396, 842, 430, 842, P.acc, 1.5));
  s.push(C(cx, 1010, 30, 'none', P.acc, 1.5) + R(cx - 8, 998, 6, 24, P.acc, 1) + R(cx + 2, 998, 6, 24, P.acc, 1) + C(cx - 84, 1010, 20, 'none', P.ink, 1, 0.4) + R(cx - 91, 1003, 14, 14, P.ink, 1, 'none', 0.8) + C(cx + 84, 1010, 20, 'none', P.acc, 1, 0.9) + T(cx + 84, 1015, 'A–B', { s: 11, f: P.acc, a: 'middle' }));
  s.push(T(1856, 66, 'Én omgang = hele sangen (0:32)', { s: 12, f: P.gr, a: 'end', ls: 1 }) + T(1856, 86, 'Inderste ring = udsnittet (4 s)', { s: 12, f: P.gr, a: 'end', ls: 1 }));
  return s.join('') + maerke(2, 'Urværk', P);
} });

/* ============ 3 · PARTITUR ============ */
K.push({ navn: 'Partitur', std: ['lys', 'varm', 'roed'], om: 'Alt ligger som baner på samme tidsakse: lyd, niveau, slag, frekvensbånd, figur og regel. Preview er et løst vindue, der kan flyttes.', tegn(P) {
  froe = 7; const s = [R(0, 0, 1920, 1080, P.bg), defs(P)];
  s.push(T(56, 62, 'Rytme Studio', { s: 22, f: P.ink, w: 700, ls: -0.3 }) + T(210, 62, 'Demo-lyd, 120 BPM', { s: 14, f: P.gr }));
  s.push(C(760, 54, 22, P.ink) + R(752, 44, 5, 20, P.bg) + R(763, 44, 5, 20, P.bg) + R(700, 44, 20, 20, 'none', 2, P.ink, 1, 1.5) + T(804, 68, '0:07,6', { s: 40, f: P.ink, w: 300, ls: -1 }) + T(940, 68, '/ 0:32', { s: 15, f: P.gr }));
  OMR.forEach((n, i) => s.push(T(1330 + i * 112, 62, n, { s: 14, f: i ? P.gr : P.ink, w: i ? 400 : 700 })));
  s.push(L(56, 96, 1864, 96, P.ink, 2));
  const x0 = 300, x1 = 1864, w = x1 - x0, tx = t => x0 + t / 16 * w;
  for (let b = 0; b <= 8; b++) { const x = tx(b * 2); s.push(L(x, 110, x, 1010, P.ink, 1, b % 2 ? 0.08 : 0.16) + T(x + 6, 126, String(b + 1), { s: 12, f: P.ink, w: 700 }) + T(x + 24, 126, tid(b * 2), { s: 11, f: P.gr })); }
  s.push(R(tx(A), 110, tx(B) - tx(A), 900, P.acc, 0, 'none', 0.09) + R(tx(A), 110, tx(B) - tx(A), 4, P.acc) + T(tx(A) + 6, 148, 'Loop A til B', { s: 11, f: P.acc, w: 700 }));
  const bane = (y, h, navn, under, klar, run) => s.push(L(56, y + h, 1864, y + h, P.ink, 1, 0.14) + T(56, y + 30, navn, { s: 17, f: klar ? P.ink : P.gr, w: 700 }) + T(56, y + 52, under, { s: 12, f: P.gr }) + (run ? T(56, y + h - 26, run, { s: 11, f: P.acc, w: 700 }) : ''));

/* ---------- Styring: vælg kladde, lys eller mørk, grundtone og accent ---------- */
const valg = { k: 0, m: null, tone: null, acc: null };
const $ = id => document.getElementById(id);
function nu() { const st = K[valg.k].std; return [valg.m || st[0], valg.tone || st[1], valg.acc || st[2]]; }
function tegn() {
  const [m, tone, acc] = nu(), P = palet(m, tone, acc);
  $('scene').innerHTML = `<svg id="kladde" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${K[valg.k].tegn(P)}</svg>`;
  $('tekst').innerHTML = `<b>${K[valg.k].runde ? K[valg.k].navn.replace('R2 ', 'Runde 2 · ') : (valg.k + 1) + ' · ' + K[valg.k].navn}.</b> ${K[valg.k].om}`;
  document.querySelectorAll('#vKladde button').forEach((b, i) => b.setAttribute('aria-pressed', i === valg.k));
  document.querySelectorAll('#vLys button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  document.querySelectorAll('#vTone button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tone));
  document.querySelectorAll('#vAcc button').forEach(b => b.setAttribute('aria-pressed', b.dataset.a === acc));
}
K.forEach((k, i) => { if (k.runde === 2 && !K[i - 1].runde) { const sp = document.createElement('span'); sp.textContent = 'Runde 2'; sp.style.marginLeft = '14px'; $('vKladde').append(sp); } const b = document.createElement('button'); b.textContent = k.runde ? k.navn.replace('R2 ', '') : (i + 1) + ' ' + k.navn; b.onclick = () => { valg.k = i; tegn(); }; $('vKladde').append(b); });
for (const t in TONER) { const b = document.createElement('button'); b.textContent = TONER[t][0]; b.dataset.t = t; b.onclick = () => { valg.tone = t; tegn(); }; $('vTone').append(b); }
for (const a in ACC) { const b = document.createElement('button'); b.className = 'farve'; b.title = ACC[a][0]; b.dataset.a = a; b.style.background = hsl(ACC[a][1], ACC[a][2], ACC[a][3]); b.onclick = () => { valg.acc = a; tegn(); }; $('vAcc').append(b); }
document.querySelectorAll('#vLys button').forEach(b => b.onclick = () => { valg.m = b.dataset.m; tegn(); });
$('std').onclick = () => { valg.m = valg.tone = valg.acc = null; tegn(); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { valg.k = (valg.k + 1) % K.length; tegn(); } if (e.key === 'ArrowLeft') { valg.k = (valg.k + K.length - 1) % K.length; tegn(); } });
window.KLADDER = { valg, tegn, K };
tegn();
