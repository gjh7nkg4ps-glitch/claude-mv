<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8"><title>Rytme Studio · fem kladder</title>
<style>
  body { margin: 0; background: #050505; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg { display: block; width: 1920px; height: 1080px; margin: 0 auto 40px; }
</style></head><body>
<div id="ud"></div>
<script>
/* Fem kladder til Rytme Studio. Hver er én SVG-tegning på 1920 × 1080. Intet her er bygget ind i programmet. */
'use strict';
const SERIF = 'Didot, "Bodoni MT", "Playfair Display", "Libre Baskerville", Georgia, "Times New Roman", serif';
const SANS = '"Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.s || 14}" fill="${o.f || '#fff'}" font-weight="${o.w || 400}" text-anchor="${o.a || 'start'}" font-family='${o.ff || SANS}' letter-spacing="${o.ls || 0}" opacity="${o.o == null ? 1 : o.o}" ${o.it ? 'font-style="italic"' : ''} ${o.rot ? `transform="rotate(${o.rot} ${x} ${y})"` : ''}>${esc(s)}</text>`;
const L = (x1, y1, x2, y2, st, w = 1, o = 1, x = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" stroke-width="${w}" opacity="${o}" ${x}/>`;
const R = (x, y, w, h, f, rx = 0, st = 'none', o = 1, sw = 1) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" rx="${rx}" stroke="${st}" stroke-width="${sw}" opacity="${o}"/>`;
const C = (cx, cy, r, f, st = 'none', sw = 1, o = 1) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${st}" stroke-width="${sw}" opacity="${o}"/>`;
let froe = 7; const rnd = () => { froe = (froe * 1664525 + 1013904223) >>> 0; return froe / 4294967296; };
/* Styrken i demo-sangen (0 til 1) ved tiden t i sekunder: slag hvert halve sekund, et roligt stykke fra 16 til 24 s. */
function niv(t) { const p = (t % 0.5) / 0.5, del = t >= 16 && t < 24 ? 0.42 : t < 8 ? 0.72 : 1; return Math.min(1, (0.28 + 0.72 * Math.exp(-4.5 * p)) * del * (0.82 + 0.18 * rnd())); }
const tid = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const polar = (cx, cy, r, grader) => { const a = (grader - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const bue = (cx, cy, r, a0, a1) => { const p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1); return `M${p0[0]} ${p0[1]} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p1[0]} ${p1[1]}`; };
const maerke = (n, navn, f, bg) => R(0, 0, 1920, 1080, 'none', 0, 'none') + `<g>${R(1920 - 250, 1080 - 44, 250, 44, bg, 0, 'none', 0.92)}${T(1920 - 20, 1080 - 17, 'Kladde ' + n + ' af 5 · ' + navn, { s: 13, f, a: 'end', ls: 0.5 })}</g>`;
const POS = 7.6, A = 8, B = 12;
const ud = [];

/* ============ 1 · GALLERI: billedet hænger som et værk; alt andet er tynde linjer og tekst ============ */
(() => {
  const ben = '#ece6da', graa = '#8d877c', s = [];
  s.push(R(0, 0, 1920, 1080, '#0d0c0b'));
  s.push(`<defs><radialGradient id="g1" cx="42%" cy="36%"><stop offset="0" stop-color="#fbf8f1"/><stop offset=".45" stop-color="#b9b2a4"/><stop offset="1" stop-color="#3a3731"/></radialGradient>
    <radialGradient id="g1b"><stop offset="0" stop-color="#ece6da" stop-opacity=".16"/><stop offset="1" stop-color="#ece6da" stop-opacity="0"/></radialGradient>
    <linearGradient id="g1v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171614"/><stop offset="1" stop-color="#0a0a09"/></linearGradient></defs>`);
  /* top: navn og arbejdsområder som ren tekst */
  s.push(T(64, 66, 'Rytme Studio', { s: 24, f: ben, ff: SERIF, it: 1 }));
  ['Afspiller', 'Analyse', 'Figurer', 'Regler', 'Show'].forEach((n, i) => { const x = 1196 + i * 136; s.push(T(x, 64, n, { s: 14, f: i ? graa : ben, ls: 2.2 })); if (!i) s.push(L(x, 76, x + 86, 76, ben, 1)); });
  s.push(L(64, 96, 1856, 96, ben, 1, 0.14));
  /* venstre: værkerne (sangene) som et katalog */
  s.push(T(64, 150, 'Værker', { s: 12, f: graa, ls: 2.4 }));
  [['Demo-lyd, 120 BPM', '0:32', 1], ['Nordlys (mix 4).mp3', '4:12', 0], ['Trommer alene.wav', '1:48', 0]].forEach((v, i) => {
    const y = 196 + i * 62;
    s.push(T(64, y, 'Nr. ' + (i + 1), { s: 12, f: graa, ls: 1 }) + T(64, y + 24, v[0], { s: 16, f: v[2] ? ben : graa, ff: SERIF }) + T(300, y + 24, v[1], { s: 13, f: graa, a: 'end' }) + L(64, y + 40, 300, y + 40, ben, 1, 0.12));
  });
  s.push(T(64, 420, 'Hent et værk', { s: 14, f: ben, ls: 1 }) + L(64, 430, 154, 430, ben, 1, 0.6) + T(64, 458, 'eller slip en lydfil i vinduet', { s: 13, f: graa }));
  /* midten: værket i ramme, med skilt under */
  s.push(R(372, 138, 1176, 600, 'url(#g1v)', 0, ben, 1) + R(372, 138, 1176, 600, 'none', 0, ben, 0.22));
  s.push(C(960, 438, 420, 'url(#g1b)') + C(960, 438, 172, 'url(#g1)') + C(960, 438, 214, 'none', ben, 1, 0.35));
  s.push(T(372, 792, 'Demo-lyd', { s: 40, f: ben, ff: SERIF }) + T(372, 822, '120 BPM  ·  stereo  ·  lavet i programmet', { s: 13, f: graa, ls: 1 }));
  s.push(T(1548, 792, '0:07,6', { s: 54, f: ben, ff: SERIF, a: 'end' }) + T(1548, 822, 'af 0:32', { s: 13, f: graa, a: 'end', ls: 1 }));
  /* tidslinjen: hårfine streger i hele bredden */
  const x0 = 372, w = 1176, yc = 912;
  for (let i = 0; i < 392; i++) { const t = i / 392 * 32, h = niv(t) * 42, x = x0 + i * 3; s.push(L(x, yc - h, x, yc + h, ben, 1, t < POS ? 0.95 : 0.28)); }
  const xa = x0 + A / 32 * w, xb = x0 + B / 32 * w, xp = x0 + POS / 32 * w;
  s.push(L(xa, 858, xb, 858, ben, 1) + L(xa, 858, xa, 866, ben) + L(xb, 858, xb, 866, ben) + T(xa, 850, 'A', { s: 12, f: ben, ff: SERIF, it: 1 }) + T(xb, 850, 'B', { s: 12, f: ben, a: 'end', ff: SERIF, it: 1 }));
  s.push(L(xp, 850, xp, 974, ben, 1.5));
  for (let b = 0; b <= 16; b += 4) s.push(T(x0 + b / 16 * w, 992, b === 16 ? '0:32' : 'takt ' + (b + 1), { s: 11, f: graa, a: b === 16 ? 'end' : 'start', ls: 1 }));
  /* afspiller: tre ord */
  s.push(T(372, 1042, 'Stop', { s: 14, f: graa, ls: 2 }) + T(452, 1042, 'Pause', { s: 14, f: ben, ls: 2 }) + L(452, 1052, 506, 1052, ben) + T(548, 1042, 'Loop A til B', { s: 14, f: ben, ls: 2 }) + T(1320, 1042, 'Lydstyrke', { s: 14, f: graa, ls: 2 }) + L(1420, 1037, 1548, 1037, ben, 1, 0.25) + L(1420, 1037, 1522, 1037, ben, 1) + C(1522, 1037, 4, ben));
  /* højre: målinger som tal og tynde streger */
  const hx = 1620;
  s.push(T(hx, 150, 'Niveau', { s: 12, f: graa, ls: 2.4 }) + T(hx, 214, '−9,6', { s: 60, f: ben, ff: SERIF }) + T(hx + 150, 214, 'dB RMS', { s: 13, f: graa, ls: 1 }) + L(hx, 240, 1856, 240, ben, 1, 0.2) + L(hx, 240, hx + 178, 240, ben, 2) + L(hx + 214, 232, hx + 214, 248, ben, 1) + T(1856, 266, 'top −2,4 dB', { s: 12, f: graa, a: 'end' }));
  s.push(T(hx, 340, 'Loop', { s: 12, f: graa, ls: 2.4 }) + T(hx, 384, 'A', { s: 15, f: graa, ff: SERIF, it: 1 }) + T(hx + 30, 384, '0:08,00', { s: 24, f: ben, ff: SERIF }) + T(hx, 420, 'B', { s: 15, f: graa, ff: SERIF, it: 1 }) + T(hx + 30, 420, '0:12,00', { s: 24, f: ben, ff: SERIF }) + L(hx, 446, 1856, 446, ben, 1, 0.14));
  s.push(T(hx, 510, 'Tempo', { s: 12, f: graa, ls: 2.4 }) + T(hx, 566, '120', { s: 48, f: ben, ff: SERIF }) + T(hx + 92, 566, 'BPM  ·  4 slag pr. takt', { s: 13, f: graa, ls: 1 }) + L(hx, 592, 1856, 592, ben, 1, 0.14) + T(hx, 622, 'Tap', { s: 14, f: ben, ls: 2 }) + T(hx + 60, 622, 'Takt 1 her', { s: 14, f: ben, ls: 2 }));
  s.push(T(hx, 706, 'Snap', { s: 12, f: graa, ls: 2.4 }) + T(hx, 738, 'Fra', { s: 14, f: graa, ls: 2 }) + T(hx + 52, 738, 'Slag', { s: 14, f: graa, ls: 2 }) + T(hx + 116, 738, 'Takt', { s: 14, f: ben, ls: 2 }) + L(hx + 116, 748, hx + 156, 748, ben));
  s.push(maerke(1, 'Galleri', ben, '#0d0c0b'));
  ud.push(s.join(''));
})();

/* ============ 2 · URVÆRK: tiden er en cirkel; sangen ligger som en ring om billedet ============ */
(() => {
  const guld = '#d9a67c', lys = '#f2ede6', graa = '#7f8894', cx = 960, cy = 528, s = [];
  s.push(`<defs><radialGradient id="g2bg" cx="50%" cy="48%"><stop offset="0" stop-color="#18202b"/><stop offset=".6" stop-color="#0d1219"/><stop offset="1" stop-color="#07090d"/></radialGradient>
    <radialGradient id="g2" cx="40%" cy="34%"><stop offset="0" stop-color="#fff4e8"/><stop offset=".5" stop-color="#d9a67c"/><stop offset="1" stop-color="#4a2f20"/></radialGradient>
    <radialGradient id="g2b"><stop offset="0" stop-color="#d9a67c" stop-opacity=".3"/><stop offset="1" stop-color="#d9a67c" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2s"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#090c11"/></radialGradient></defs>`);
  s.push(R(0, 0, 1920, 1080, 'url(#g2bg)'));
  s.push(T(64, 66, 'RYTME STUDIO', { s: 15, f: lys, ls: 6, w: 500 }) + T(64, 90, 'Demo-lyd  ·  120 BPM', { s: 13, f: graa, ls: 1 }));
  ['Afspiller', 'Analyse', 'Figurer', 'Regler', 'Show'].forEach((n, i) => { s.push(T(64, 470 + i * 38, n, { s: 14, f: i ? graa : lys, ls: 2 })); if (!i) s.push(L(40, 465, 54, 465, guld, 1.5)); });
  /* ydre ring: hele sangen som stråler */
  const N = 360, r1 = 372;
  for (let i = 0; i < N; i++) { const t = i / N * 32, a = i, h = 8 + niv(t) * 56, p0 = polar(cx, cy, r1, a), p1 = polar(cx, cy, r1 + h, a); s.push(L(p0[0], p0[1], p1[0], p1[1], t < POS ? guld : lys, 2.2, t < POS ? 1 : 0.2)); }
  s.push(C(cx, cy, r1 - 8, 'none', lys, 1, 0.22));
  for (let b = 0; b < 16; b++) { const a = b / 16 * 360, p0 = polar(cx, cy, r1 - 8, a), p1 = polar(cx, cy, r1 - (b % 4 ? 18 : 26), a), pt = polar(cx, cy, r1 - 42, a); s.push(L(p0[0], p0[1], p1[0], p1[1], lys, b % 4 ? 1 : 1.6, 0.7)); if (b % 2 === 0) s.push(T(pt[0], pt[1] + 4, tid(b * 2), { s: 12, f: graa, a: 'middle', ls: 0.5 })); }
  /* loop A til B: en bue uden på ringen */
  s.push(`<path d="${bue(cx, cy, r1 + 78, A / 32 * 360, B / 32 * 360)}" fill="none" stroke="${guld}" stroke-width="3"/>`);
  [[A, 'A'], [B, 'B']].forEach(([t, n]) => { const p = polar(cx, cy, r1 + 100, t / 32 * 360); s.push(T(p[0], p[1] + 5, n, { s: 14, f: guld, a: 'middle', w: 600 })); });
  /* indre ring: udsnittet (zoom), her 4 sekunder omkring viseren */
  const r2 = 286;
  for (let i = 0; i < 240; i++) { const t = POS - 2 + i / 240 * 4, a = i * 1.5, h = 4 + niv(Math.max(0, t)) * 30, p0 = polar(cx, cy, r2 - h, a), p1 = polar(cx, cy, r2, a); s.push(L(p0[0], p0[1], p1[0], p1[1], i < 120 ? guld : lys, 1.6, i < 120 ? 0.75 : 0.16)); }
  s.push(C(cx, cy, r2 + 10, 'none', lys, 1, 0.12));
  /* billedet i midten */
  s.push(C(cx, cy, 236, 'url(#g2s)', lys, 1, 1) + C(cx, cy, 236, 'none', lys, 1, 0.25) + C(cx, cy, 220, 'url(#g2b)') + C(cx, cy, 104, 'url(#g2)') + C(cx, cy, 132, 'none', lys, 1, 0.3));
  /* viseren */
  const pv0 = polar(cx, cy, 240, POS / 32 * 360), pv1 = polar(cx, cy, r1 + 70, POS / 32 * 360);
  s.push(L(pv0[0], pv0[1], pv1[0], pv1[1], guld, 2.5) + C(pv1[0], pv1[1], 5, guld));
  s.push(T(cx, cy + 300, '0:07,6', { s: 13, f: guld, a: 'middle', ls: 1 }));
  /* fire små urskiver i hjørnerne (i ure hedder de komplikationer) */
  const skive = (x, y, navn, tal, enhed, andel) => {
    s.push(C(x, y, 92, '#0c1016', lys, 1, 1) + C(x, y, 92, 'none', lys, 1, 0.22));
    s.push(`<path d="${bue(x, y, 76, 225, 495)}" fill="none" stroke="${lys}" stroke-width="2" opacity=".18"/><path d="${bue(x, y, 76, 225, 225 + 270 * andel)}" fill="none" stroke="${guld}" stroke-width="3" stroke-linecap="round"/>`);
    for (let i = 0; i <= 9; i++) { const p0 = polar(x, y, 84, 225 + i * 30), p1 = polar(x, y, 89, 225 + i * 30); s.push(L(p0[0], p0[1], p1[0], p1[1], lys, 1, 0.5)); }
    s.push(T(x, y + 10, tal, { s: 34, f: lys, a: 'middle', w: 300 }) + T(x, y + 34, enhed, { s: 11, f: graa, a: 'middle', ls: 1.5 }) + T(x, y - 112, navn, { s: 12, f: graa, a: 'middle', ls: 3 }));
  };
  skive(1560, 250, 'NIVEAU', '−9,6', 'dB RMS', 0.82); skive(1760, 470, 'TEMPO', '120', 'BPM · 4/4', 0.45);
  skive(1560, 800, 'LYDSTYRKE', '80', 'procent', 0.8);
  s.push(C(1760, 690, 4, guld) + C(1778, 690, 4, lys, 'none', 1, 0.3) + C(1796, 690, 4, lys, 'none', 1, 0.3) + C(1814, 690, 4, lys, 'none', 1, 0.3) + T(1700, 695, 'slag', { s: 11, f: graa, ls: 1.5 }));
  /* loop og afspiller */
  s.push(T(300, 232, 'LOOP', { s: 12, f: graa, ls: 3 }) + T(300, 272, 'A  0:08,00', { s: 20, f: lys, w: 300 }) + T(300, 302, 'B  0:12,00', { s: 20, f: lys, w: 300 }) + L(300, 320, 420, 320, guld, 1.5) + T(300, 344, 'tændt', { s: 12, f: guld, ls: 1.5 }));
  s.push(T(300, 800, 'SNAP', { s: 12, f: graa, ls: 3 }) + T(300, 832, 'Fra', { s: 14, f: graa, ls: 1 }) + T(344, 832, 'Slag', { s: 14, f: graa, ls: 1 }) + T(396, 832, 'Takt', { s: 14, f: lys, ls: 1 }) + L(396, 842, 430, 842, guld, 1.5));
  s.push(C(cx, 1010, 30, 'none', guld, 1.5) + R(cx - 8, 998, 6, 24, guld, 1) + R(cx + 2, 998, 6, 24, guld, 1) + C(cx - 84, 1010, 20, 'none', lys, 1, 0.4) + R(cx - 91, 1003, 14, 14, lys, 1, 'none', 0.8) + C(cx + 84, 1010, 20, 'none', guld, 1, 0.9) + T(cx + 84, 1015, 'A–B', { s: 11, f: guld, a: 'middle' }));
  s.push(T(1856, 66, 'Én omgang = hele sangen (0:32)', { s: 12, f: graa, a: 'end', ls: 1 }) + T(1856, 86, 'Inderste ring = udsnittet (4 s)', { s: 12, f: graa, a: 'end', ls: 1 }));
  s.push(maerke(2, 'Urværk', lys, '#07090d'));
  ud.push(s.join(''));
})();

/* ============ 3 · PARTITUR: alt ligger som baner på samme tidsakse, lyst som nodepapir ============ */
(() => {
  const papir = '#f4f1e9', blaek = '#16140f', graa = '#8b867a', roed = '#d8432a', s = [];
  s.push(R(0, 0, 1920, 1080, papir));
  s.push(`<defs><radialGradient id="g3" cx="40%" cy="34%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e4573d"/><stop offset="1" stop-color="#5a1a10"/></radialGradient><radialGradient id="g3b"><stop offset="0" stop-color="#e4573d" stop-opacity=".35"/><stop offset="1" stop-color="#e4573d" stop-opacity="0"/></radialGradient>
    <filter id="sk3" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16140f" flood-opacity=".28"/></filter></defs>`);
  s.push(T(56, 62, 'Rytme Studio', { s: 22, f: blaek, w: 700, ls: -0.3 }) + T(210, 62, 'Demo-lyd, 120 BPM', { s: 14, f: graa }));
  s.push(C(760, 54, 22, blaek) + R(752, 44, 5, 20, papir) + R(763, 44, 5, 20, papir) + R(700, 44, 20, 20, 'none', 2, blaek, 1, 1.5) + T(804, 68, '0:07,6', { s: 40, f: blaek, w: 300, ls: -1 }) + T(940, 68, '/ 0:32', { s: 15, f: graa }));
  ['Afspiller', 'Analyse', 'Figurer', 'Regler', 'Show'].forEach((n, i) => { const x = 1330 + i * 112; s.push(T(x, 62, n, { s: 14, f: i ? graa : blaek, w: i ? 400 : 700 })); });
  s.push(L(56, 96, 1864, 96, blaek, 2));
  const x0 = 300, x1 = 1864, w = x1 - x0, tx = t => x0 + t / 16 * w;   /* udsnittet er 16 sekunder: 0:00 til 0:16 */
  /* tidsakse med takter */
  for (let b = 0; b <= 8; b++) { const x = tx(b * 2); s.push(L(x, 110, x, 1010, blaek, 1, b % 2 ? 0.08 : 0.16) + T(x + 6, 126, String(b + 1), { s: 12, f: blaek, w: 700 }) + T(x + 24, 126, tid(b * 2), { s: 11, f: graa })); }
  /* loop som et bånd gennem alle baner */
  s.push(R(tx(A), 110, tx(B) - tx(A), 900, roed, 0, 'none', 0.07) + R(tx(A), 110, tx(B) - tx(A), 4, roed) + T(tx(A) + 6, 148, 'Loop A til B', { s: 11, f: roed, w: 700 }));
  const bane = (y, h, navn, under, klar) => { s.push(L(56, y + h, 1864, y + h, blaek, 1, 0.14) + T(56, y + 30, navn, { s: 17, f: klar ? blaek : graa, w: 700 }) + T(56, y + 52, under, { s: 12, f: graa })); };
  /* bane 1: lyd */
  bane(160, 190, 'Lyd', 'Bølgeform, top og RMS', 1);
  for (let i = 0; i < 520; i++) { const t = i / 520 * 16, h = niv(t) * 78, x = x0 + i * (w / 520); s.push(L(x, 255 - h, x, 255 + h, blaek, 1.6, t < POS ? 1 : 0.32)); }
  /* bane 2: niveau som kurve */
  bane(350, 120, 'Niveau', 'RMS i dB  ·  −9,6 nu', 1);
  let d = ''; for (let i = 0; i <= 260; i++) { const t = i / 260 * 16, y = 456 - niv(t) * 84; d += (i ? 'L' : 'M') + (x0 + i * (w / 260)).toFixed(1) + ' ' + y.toFixed(1); }
  s.push(`<path d="${d}" fill="none" stroke="${blaek}" stroke-width="1.6"/>` + L(x0, 386, x1, 386, blaek, 1, 0.1, 'stroke-dasharray="2 5"') + T(x1, 382, '0 dB', { s: 10, f: graa, a: 'end' }));
  /* bane 3: slag (kommer i Run 2) */
  bane(470, 130, 'Slag', 'Kick · Snare · Hihat', 0);
  [['Kick', 502, t => t % 0.5 < 0.01 && !(t >= 16)], ['Snare', 536, t => t % 1 > 0.49 && t % 1 < 0.51 && t >= 8], ['Hihat', 570, t => true]].forEach(([n, y, f], k) => {
    s.push(T(x0 - 14, y + 4, n, { s: 11, f: graa, a: 'end' }));
    for (let i = 0; i < 64; i++) { const t = i * 0.25; if (k < 2 ? f(t) : true) s.push(k === 2 ? L(tx(t), y - 5, tx(t), y + 5, blaek, 1.5, 0.45) : C(tx(t), y, k ? 5 : 6.5, k ? 'none' : blaek, blaek, 1.6, t < POS ? 1 : 0.4)); }
  });
  s.push(T(56, 574, 'Run 2', { s: 11, f: roed, w: 700 }));
  /* bane 4: bånd */
  bane(600, 110, 'Frekvensbånd', 'Sub til brilliance', 0);
  for (let r = 0; r < 7; r++) for (let i = 0; i < 128; i++) { const t = i / 128 * 16, v = niv(t) * (1 - r * 0.11) * (0.5 + rnd() * 0.5); s.push(R(x0 + i * (w / 128), 618 + r * 12, w / 128 - 1, 10, blaek, 0, 'none', v * (t < POS ? 0.9 : 0.4))); }
  s.push(T(56, 684, 'Run 2', { s: 11, f: roed, w: 700 }));
  /* bane 5: figur */
  bane(710, 130, 'Cirkel', 'Størrelse  ←  Niveau × 0,9', 0);
